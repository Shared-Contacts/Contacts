/* ============================================================
   Diary: appointments and to-dos
   ============================================================ */
let ITEMS=[], ITEM_SHARES=[], DIARY_DONE=false, EDIT_ITEM=null, ITEM_KIND='todo';
let ROUTINES=[];
let DIARY_VIEW='list', DIARY_DAY=null;
let DIARY_MONTH=new Date().toISOString().slice(0,7);
try{ DIARY_VIEW=localStorage.getItem('dview')||'list'; }catch(e){}

const REMIND_CHOICES=[
  ['','No reminder'],['0','At the time'],
  ['5','5 minutes before'],['15','15 minutes before'],['30','30 minutes before'],
  ['60','1 hour before'],['120','2 hours before'],['360','6 hours before'],
  ['720','12 hours before'],['1440','1 day before'],['2880','2 days before'],
  ['10080','1 week before']
];
const REPEATS=[['none','Does not repeat'],['daily','Every day'],['weekly','Every week'],
  ['fortnightly','Every fortnight'],['monthly','Every month'],['yearly','Every year']];

const whenOf = it => it.kind==='appointment' ? it.starts_at : it.due_at;

function localValue(iso){            // ISO -> value for datetime-local
  if(!iso) return '';
  const d=new Date(iso);
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const isoValue = v => v ? new Date(v).toISOString() : null;

function whenText(it){
  const w=whenOf(it);
  if(!w) return 'No date';
  const d=new Date(w), now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const that =new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const days=Math.round((that-today)/86400000);
  const time=it.all_day?'':d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  let day;
  if(days===0) day='Today';
  else if(days===1) day='Tomorrow';
  else if(days===-1) day='Yesterday';
  else if(days>1&&days<7) day=d.toLocaleDateString('en-GB',{weekday:'long'});
  else day=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',
        year:d.getFullYear()===now.getFullYear()?undefined:'numeric'});
  let txt=[day,time].filter(Boolean).join(', ');
  if(it.kind==='appointment'&&it.ends_at){
    const e=new Date(it.ends_at);
    if(e.toDateString()!==d.toDateString()){
      const sameYear=e.getFullYear()===d.getFullYear();
      txt=d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})
        +' to '+e.toLocaleDateString('en-GB',{day:'numeric',month:'short',
            year:sameYear?undefined:'numeric'});
      const nights=Math.round((new Date(e.getFullYear(),e.getMonth(),e.getDate())
        -new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
      txt+=' ('+(nights+1)+' days)';
    }
  }
  if(it.kind==='todo'&&it.due_from&&new Date(it.due_from)>now)
    txt='from '+new Date(it.due_from).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' until '+txt;
  return txt;
}
const isLate = it => !it.done_at && whenOf(it) && new Date(whenOf(it)) < new Date();

function dueSoonCount(){
  const end=new Date(); end.setHours(23,59,59,999);
  return ITEMS.filter(it=>!it.done_at&&whenOf(it)&&new Date(whenOf(it))<=end).length;
}
function paintDue(){
  const n=dueSoonCount(), dot=$('dueDot');
  dot.textContent=n; dot.className=n?'on':'';
}

/* ---------- the diary list ---------- */
function openDiary(){
  renderDiary();
  $('diary').classList.remove('hidden'); $('diaryBody').scrollTop=0; lockBackground();
}

// An appointment occupies every day from its start to its end, so ten days
// away shows on all ten and nothing gets booked over it.
function itemsOn(day){
  const a=new Date(day.getFullYear(),day.getMonth(),day.getDate()).getTime();
  const b=a+86400000;
  return ITEMS.filter(it=>{
    if(DIARY_DONE ? !it.done_at : it.done_at) return false;
    if(it.kind==='appointment' && it.starts_at){
      const st=new Date(it.starts_at).getTime();
      const en=it.ends_at ? new Date(it.ends_at).getTime() : st;
      return st < b && en >= a;
    }
    const w=whenOf(it); if(!w) return false;
    const t=new Date(w).getTime();
    return t>=a && t<b;
  });
}

function itemRow(it){
  const c=it.contact_id?CONTACTS.find(x=>x.id===it.contact_id):null;
  const shared=ITEM_SHARES.some(x=>x.item_id===it.id)||it.created_by!==ME.id;
  return `<div class="item">
    <button class="tick ${it.done_at?'on':''}" data-done="${it.id}"
      aria-label="${it.done_at?'Mark as not done':'Mark as done'}">${it.done_at?'&#10003;':''}</button>
    <button class="mid" data-item="${it.id}">
      <span class="t ${it.done_at?'done':''}">${esc(it.title)}</span>
      <span class="w ${isLate(it)?'late':''}">${it.kind==='appointment'?'&#128197; ':''}${esc(whenText(it))}${shared?' &middot; shared':''}</span>
      ${c?`<span class="who2">${esc(fullName(c))}</span>`:''}
    </button></div>`;
}

function renderDiary(){
  let html=`<div class="kindpick">
      <button data-dview="list"    aria-pressed="${DIARY_VIEW==='list'}">List</button>
      <button data-dview="week"    aria-pressed="${DIARY_VIEW==='week'}">Week</button>
      <button data-dview="month"   aria-pressed="${DIARY_VIEW==='month'}">Month</button>
      <button data-dview="routine" aria-pressed="${DIARY_VIEW==='routine'}">Regular</button>
    </div>`;

  if(DIARY_VIEW==='list')         html+=diaryList();
  else if(DIARY_VIEW==='week')    html+=diaryWeek();
  else if(DIARY_VIEW==='routine') html+=diaryRoutine();
  else                            html+=diaryMonth();

  if(DIARY_VIEW!=='routine') html+='<div id="pushSlot"></div>';

  $('diaryBody').innerHTML=html;
  if(DIARY_VIEW!=='routine') pushCard().then(h=>{
    const slot=$('pushSlot'); if(!slot) return;
    slot.innerHTML=h;
    const on=$('pushOn');  if(on)  on.onclick=enablePush;
    const off=$('pushOff'); if(off) off.onclick=disablePush;
    const rt=$('pushRetry'); if(rt) rt.onclick=()=>renderDiary();
  });
  wireRoutine();

  $('diaryBody').querySelectorAll('[data-dview]').forEach(b=>b.onclick=()=>{
    DIARY_VIEW=b.dataset.dview;
    try{ localStorage.setItem('dview',DIARY_VIEW); }catch(e){}
    renderDiary(); });
  $('diaryBody').querySelectorAll('[data-dv]').forEach(b=>b.onclick=()=>{
    DIARY_DONE=b.dataset.dv==='done'; renderDiary(); });
  $('diaryBody').querySelectorAll('[data-done]').forEach(b=>
    b.onclick=()=>toggleDone(Number(b.dataset.done)));
  $('diaryBody').querySelectorAll('[data-item]').forEach(b=>
    b.onclick=()=>openItem(ITEMS.find(x=>x.id===Number(b.dataset.item))));
  $('diaryBody').querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
    DIARY_DAY=b.dataset.day; renderDiary(); });
  $('diaryBody').querySelectorAll('[data-mshift]').forEach(b=>b.onclick=()=>{
    const d=new Date(DIARY_MONTH+'-01T12:00:00');
    d.setMonth(d.getMonth()+Number(b.dataset.mshift));
    DIARY_MONTH=d.toISOString().slice(0,7);
    DIARY_DAY=null; renderDiary(); });

}

/* ---------- the standing list of regular jobs ---------- */
function diaryRoutine(){
  const headings=[...new Set(ROUTINES.map(r=>r.heading||''))];
  let html=`<p class="coords">Jobs you come back to. Untick one and it rises to the
    top as needing doing; tick it and it drops down. Nothing is deleted unless you
    say so.</p>`;

  if(!ROUTINES.length)
    html+=`<div class="card"><div class="field"><dd>Nothing here yet. Add your
      first regular job below.</dd></div></div>`;

  headings.sort((a,b)=>a===''?1:b===''?-1:a.localeCompare(b)).forEach(h=>{
    const rows=ROUTINES.filter(r=>(r.heading||'')===h);
    const todo=rows.filter(r=>!r.done).sort((a,b)=>a.sort_order-b.sort_order);
    const done=rows.filter(r=>r.done)
      .sort((a,b)=>new Date(b.done_at||0)-new Date(a.done_at||0));
    if(!rows.length) return;
    html+=`<p class="dsec">${esc(h||'Anything else')}
      <span style="float:right;font-weight:400;text-transform:none;letter-spacing:0">
        ${todo.length} to do</span></p><div class="card">`;
    todo.forEach(r=>{ html+=routineRow(r); });
    if(todo.length&&done.length)
      html+=`<div class="field"><dd style="color:var(--muted);font-size:14px">Done</dd></div>`;
    done.forEach(r=>{ html+=routineRow(r); });
    html+='</div>';
  });

  html+=`<div class="card"><h3>Add a regular job</h3>
    <div class="setadd">
      <input id="rtTitle" placeholder="What needs doing">
      <input id="rtHead" list="dlHead" placeholder="Heading (optional), e.g. Boat">
      <datalist id="dlHead">${knownHeadings()
        .map(h=>`<option value="${esc(h)}">`).join('')}</datalist>
      <button class="btn primary" id="rtAdd">Add it</button>
    </div></div>`;

  const anyDone=ROUTINES.some(r=>r.done);
  if(anyDone)
    html+=`<div class="card"><div class="setadd">
      <button class="btn" id="rtReset" style="border:1.5px solid var(--rule)">
        Untick everything &mdash; start the round again</button></div></div>`;
  return html;
}

// Headings you have used before, kept on this device so they still offer
// themselves after the last job under a heading is ticked off or removed.
function knownHeadings(){
  let saved=[];
  try{ saved=JSON.parse(localStorage.getItem('headings')||'[]'); }catch(e){}
  const live=ROUTINES.map(r=>r.heading).filter(Boolean);
  return [...new Set([...live,...saved])].sort((a,b)=>a.localeCompare(b));
}
function rememberHeading(h){
  if(!h) return;
  const all=[...new Set([h,...knownHeadings()])].slice(0,40);
  try{ localStorage.setItem('headings',JSON.stringify(all)); }catch(e){}
}

function routineRow(r){
  return `<div class="item">
    <button class="tick ${r.done?'on':''}" data-rt="${r.id}"
      aria-label="${r.done?'Mark as needing doing':'Mark as done'}">${r.done?'&#10003;':''}</button>
    <button class="mid" data-rtedit="${r.id}">
      <span class="t ${r.done?'done':''}">${esc(r.title)}</span>
      ${r.done&&r.done_at?`<span class="w">done ${esc(new Date(r.done_at)
        .toLocaleDateString('en-GB',{day:'numeric',month:'short'}))}</span>`:''}
    </button>
    <button class="del" data-rtdel="${r.id}" aria-label="Remove">&times;</button></div>`;
}

function wireRoutine(){
  const body=$('diaryBody');
  body.querySelectorAll('[data-rt]').forEach(b=>b.onclick=async()=>{
    const r=ROUTINES.find(x=>x.id===Number(b.dataset.rt));
    const want=!r.done;
    const patch={done:want, done_at:want?new Date().toISOString():null};
    if(!want) patch.sort_order=Math.min(0,...ROUTINES.map(x=>x.sort_order))-1;
    const {error}=await sb.from('routines').update(patch).eq('id',r.id);
    if(error){toast('Could not change that');return;}
    await loadAll(); renderDiary();
  });
  body.querySelectorAll('[data-rtdel]').forEach(b=>b.onclick=async()=>{
    const r=ROUTINES.find(x=>x.id===Number(b.dataset.rtdel));
    if(!confirm('Remove "'+r.title+'" from the regular list for good?'))return;
    const {error}=await sb.from('routines').delete().eq('id',r.id);
    if(error){toast('Could not remove it');return;}
    await loadAll(); renderDiary(); toast('Removed');
  });
  body.querySelectorAll('[data-rtedit]').forEach(b=>b.onclick=async()=>{
    const r=ROUTINES.find(x=>x.id===Number(b.dataset.rtedit));
    const t=prompt('Change the wording:',r.title);
    if(t===null||!t.trim())return;
    const {error}=await sb.from('routines').update({title:t.trim()}).eq('id',r.id);
    if(error){toast('Could not save');return;}
    await loadAll(); renderDiary();
  });
  const add=$('rtAdd');
  if(add) add.onclick=async()=>{
    const t=$('rtTitle').value.trim();
    if(!t){toast('Give it a name');return;}
    const head=$('rtHead').value.trim()||null;
    const {error}=await sb.from('routines').insert({
      created_by:ME.id, title:t, heading:head,
      sort_order:Math.max(100,...ROUTINES.map(x=>x.sort_order))+1});
    if(error){toast('Could not add it');console.error(error);return;}
    rememberHeading(head);
    await loadAll(); renderDiary(); toast('Added');
    const h=$('rtHead'); if(h) h.value=head||'';
  };
  const reset=$('rtReset');
  if(reset) reset.onclick=async()=>{
    if(!confirm('Untick every job on the regular list?'))return;
    const {error}=await sb.from('routines')
      .update({done:false,done_at:null}).eq('created_by',ME.id).eq('done',true);
    if(error){toast('Could not reset them');return;}
    await loadAll(); renderDiary(); toast('All unticked');
  };
}

/* ---------- list ---------- */
function diaryList(){
  const live=ITEMS.filter(it=>DIARY_DONE ? it.done_at : !it.done_at);
  live.sort((a,b)=>{
    const wa=whenOf(a), wb=whenOf(b);
    if(!wa&&!wb) return a.title.localeCompare(b.title);
    if(!wa) return 1;
    if(!wb) return -1;
    return new Date(wa)-new Date(wb);
  });

  const now=new Date();
  const midnight=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const bucketOf=it=>{
    const w=whenOf(it);
    if(!w) return 'No date set';
    const d=new Date(w);
    const days=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-midnight)/86400000);
    if(days<0) return 'Overdue';
    if(days===0) return 'Today';
    if(days===1) return 'Tomorrow';
    if(days<7) return 'This week';
    if(days<31) return 'This month';
    return 'Later';
  };

  let html=`<div class="kindpick" style="margin-bottom:10px">
      <button data-dv="open" aria-pressed="${!DIARY_DONE}">To come</button>
      <button data-dv="done" aria-pressed="${DIARY_DONE}">Finished</button>
    </div>`;

  if(!live.length)
    return html+`<div class="card"><div class="field"><dd>${DIARY_DONE
      ?'Nothing finished yet.':'Nothing due. Tap Add to put something in.'}</dd></div></div>`;

  let last=null, open=false;
  live.forEach(it=>{
    const b=bucketOf(it);
    if(b!==last){
      if(open) html+='</div>';
      html+=`<p class="dsec">${esc(b)}</p><div class="card">`;
      last=b; open=true;
    }
    html+=itemRow(it);
  });
  if(open) html+='</div>';
  return html;
}

/* ---------- week ---------- */
function diaryWeek(){
  const now=new Date();
  const start=new Date(now.getFullYear(),now.getMonth(),now.getDate());  // today
  let html='';
  for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const rows=itemsOn(d).sort((a,b)=>new Date(whenOf(a))-new Date(whenOf(b)));
    const isToday=i===0;
    html+=`<p class="dsec">${isToday?'Today &mdash; ':''}${esc(d.toLocaleDateString('en-GB',
      {weekday:'long',day:'numeric',month:'short'}))}</p>
      <div class="card">${rows.length?rows.map(itemRow).join('')
        :'<div class="field"><dd style="color:var(--muted);font-size:15px">Nothing.</dd></div>'}</div>`;
  }
  return html;
}

/* ---------- month ---------- */
function diaryMonth(){
  const [yy,mm]=DIARY_MONTH.split('-').map(Number);
  const first=new Date(yy,mm-1,1);
  const label=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const lead=(first.getDay()+6)%7;                       // Monday-first
  const days=new Date(yy,mm,0).getDate();
  const today=new Date(); today.setHours(0,0,0,0);

  let cells='';
  for(let i=0;i<lead;i++) cells+='<span class="mcell blank"></span>';
  for(let n=1;n<=days;n++){
    const d=new Date(yy,mm-1,n);
    const on=itemsOn(d);
    const key=`${yy}-${String(mm).padStart(2,'0')}-${String(n).padStart(2,'0')}`;
    const appt=on.some(x=>x.kind==='appointment'), todo=on.some(x=>x.kind==='todo');
    const late=on.some(isLate);
    cells+=`<button class="mcell${d.getTime()===today.getTime()?' today':''}${DIARY_DAY===key?' picked':''}"
        data-day="${key}">
        <span class="n">${n}</span>
        <span class="dots">${appt?'<i class="a"></i>':''}${todo?`<i class="${late?'l':'t'}"></i>`:''}</span>
      </button>`;
  }

  const names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
    .map(x=>`<span class="mhd">${x}</span>`).join('');

  let html=`<div class="mnav">
      <button data-mshift="-1" aria-label="Previous month">&#9664;</button>
      <span>${esc(label)}</span>
      <button data-mshift="1" aria-label="Next month">&#9654;</button>
    </div>
    <div class="mgrid">${names}${cells}</div>
    <p class="coords" style="text-align:center">
      <i class="key a"></i> appointment &nbsp; <i class="key t"></i> to-do &nbsp;
      <i class="key l"></i> overdue</p>`;

  if(DIARY_DAY){
    const [y,m,dd]=DIARY_DAY.split('-').map(Number);
    const d=new Date(y,m-1,dd);
    const rows=itemsOn(d).sort((a,b)=>new Date(whenOf(a))-new Date(whenOf(b)));
    html+=`<p class="dsec">${esc(d.toLocaleDateString('en-GB',
      {weekday:'long',day:'numeric',month:'long'}))}</p>
      <div class="card">${rows.length?rows.map(itemRow).join('')
        :'<div class="field"><dd style="color:var(--muted);font-size:15px">Nothing that day.</dd></div>'}</div>`;
  }else{
    html+='<p class="coords" style="text-align:center">Tap a day to see what is on.</p>';
  }
  return html;
}

    </fieldset>

    ${it?'<button type="button" class="btn danger" id="itDelete">Delete this</button>':''}
  </form>`;

  const f=$('itForm');
  if(it){
    f.elements['title'].value=it.title||'';
    f.elements['notes'].value=it.notes||'';
    f.elements['starts_at'].value=localValue(it.starts_at);
    f.elements['ends_at'].value=localValue(it.ends_at);
    f.elements['due_at'].value=localValue(it.due_at);
    f.elements['due_from'].value=localValue(it.due_from);
    f.elements['all_day'].checked=!!it.all_day;
    f.elements['remind_mins'].value=it.remind_mins==null?'':String(it.remind_mins);
    f.elements['repeat_every'].value=it.repeat_every||'none';
    $('itDelete').onclick=()=>deleteItem(it);
  }else{
    const soon=new Date(Date.now()+60*60*1000);
    soon.setMinutes(0,0,0);
    f.elements['due_at'].value=localValue(soon);
    f.elements['starts_at'].value=localValue(soon);
    f.elements['remind_mins'].value='60';
  }
  if(cid) f.elements['contact_id'].value=String(cid);
  if(it) ITEM_SHARES.filter(x=>x.item_id===it.id).forEach(x=>{
    const b=f.querySelector(`input[name="alsoremind"][value="${x.user_id}"]`);
    if(b) b.checked=true;
  });

  const applyKind=()=>{
    $('fsAppt').style.display = ITEM_KIND==='appointment' ? '' : 'none';
    $('fsTodo').style.display = ITEM_KIND==='todo' ? '' : 'none';
    $('itBody').querySelectorAll('[data-kind]').forEach(b=>
      b.setAttribute('aria-pressed', b.dataset.kind===ITEM_KIND));
  };
  $('itBody').querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{
    ITEM_KIND=b.dataset.kind; applyKind(); });
  applyKind();

  $('itemEd').classList.remove('hidden'); $('itBody').scrollTop=0; lockBackground();
}

async function saveItem(){
  const f=$('itForm');
  const title=f.elements['title'].value.trim();
  if(!title){ toast('Give it a title'); return; }

  const d={
    kind:ITEM_KIND, title,
    notes:f.elements['notes'].value.trim()||null,
    contact_id:f.elements['contact_id'].value?Number(f.elements['contact_id'].value):null,
    repeat_every:f.elements['repeat_every'].value,
    all_day:f.elements['all_day'].checked,
    starts_at:null, ends_at:null, due_at:null, due_from:null
  };
  if(ITEM_KIND==='appointment'){
    d.starts_at=isoValue(f.elements['starts_at'].value);
    d.ends_at  =isoValue(f.elements['ends_at'].value);
    if(!d.starts_at){ toast('An appointment needs a start time'); return; }
  }else{
    d.due_at  =isoValue(f.elements['due_at'].value);
    d.due_from=isoValue(f.elements['due_from'].value);
  }

  const mins=f.elements['remind_mins'].value;
  d.remind_mins = mins===''?null:Number(mins);
  const anchor = whenOf(d);
  d.remind_at = (d.remind_mins!=null && anchor)
    ? new Date(new Date(anchor).getTime() - d.remind_mins*60000).toISOString()
    : null;

  $('itSave').disabled=true;
  let err;
  if(EDIT_ITEM){
    const r=await sb.from('items').update(d)
      .eq('id',EDIT_ITEM.id).eq('updated_at',EDIT_ITEM.updated_at).select();
    err=r.error;
    if(!err && (!r.data||!r.data.length)){
      $('itSave').disabled=false;
      alert('Someone else changed this while you had it open, so nothing was saved.');
      await loadAll(); $('itemEd').classList.add('hidden'); lockBackground(); renderDiary();
      return;
    }
  }else{
    d.created_by=ME.id;
    err=(await sb.from('items').insert(d)).error;
  }
  if(err){ $('itSave').disabled=false; toast('Could not save'); console.error(err); return; }

  // who else should see it
  let itemId=EDIT_ITEM?EDIT_ITEM.id:null;
  if(!itemId){
    const {data:fresh}=await sb.from('items').select('id')
      .eq('created_by',ME.id).order('id',{ascending:false}).limit(1);
    itemId=fresh&&fresh[0]?fresh[0].id:null;
  }
  if(itemId){
    const want=[...f.querySelectorAll('input[name="alsoremind"]:checked')].map(b=>b.value);
    const had=ITEM_SHARES.filter(x=>x.item_id===itemId).map(x=>x.user_id);
    const add=want.filter(u=>!had.includes(u));
    const go =had.filter(u=>!want.includes(u));
    if(add.length) await sb.from('item_shares')
      .insert(add.map(u=>({item_id:itemId,user_id:u,can_edit:true})));
    for(const u of go) await sb.from('item_shares')
      .delete().eq('item_id',itemId).eq('user_id',u);
  }

  $('itSave').disabled=false;
  $('itemEd').classList.add('hidden'); lockBackground();
  await loadAll();
  if(!$('diary').classList.contains('hidden')) renderDiary();
  if(!$('detail').classList.contains('hidden')&&CURRENT) openDetail(CURRENT.id,true);
  toast('Saved');
}

async function deleteItem(it){
  if(!confirm('Delete "'+it.title+'"?')) return;
  const {error}=await sb.from('items').delete().eq('id',it.id);
  if(error){ toast('Could not delete'); return; }
  $('itemEd').classList.add('hidden'); lockBackground();
  await loadAll(); renderDiary(); toast('Deleted');
}

function nextDate(iso, every){
  const d=new Date(iso);
  if(every==='daily')       d.setDate(d.getDate()+1);
  else if(every==='weekly') d.setDate(d.getDate()+7);
  else if(every==='fortnightly') d.setDate(d.getDate()+14);
  else if(every==='monthly')d.setMonth(d.getMonth()+1);
  else if(every==='yearly') d.setFullYear(d.getFullYear()+1);
  else return null;
  return d.toISOString();
}

async function toggleDone(id){
  const it=ITEMS.find(x=>x.id===id);
  if(!it) return;
  if(it.done_at){
    const {error}=await sb.from('items').update({done_at:null}).eq('id',id);
    if(error){ toast('Could not change that'); return; }
  }else if(it.repeat_every&&it.repeat_every!=='none'&&whenOf(it)){
    // A repeating item rolls forward instead of disappearing
    const field=it.kind==='appointment'?'starts_at':'due_at';
    const nxt=nextDate(whenOf(it),it.repeat_every);
    const patch={[field]:nxt};
    if(it.kind==='appointment'&&it.ends_at) patch.ends_at=nextDate(it.ends_at,it.repeat_every);
    if(it.due_from) patch.due_from=nextDate(it.due_from,it.repeat_every);
    patch.remind_at = it.remind_mins!=null
      ? new Date(new Date(nxt).getTime()-it.remind_mins*60000).toISOString() : null;
    const {error}=await sb.from('items').update(patch).eq('id',id);
    if(error){ toast('Could not roll it forward'); return; }
    toast('Done — moved to '+whenText({...it,[field]:nxt}));
  }else{
    const {error}=await sb.from('items').update({done_at:new Date().toISOString()}).eq('id',id);
    if(error){ toast('Could not change that'); return; }
  }
  await loadAll();
  renderDiary();
  if(!$('detail').classList.contains('hidden')&&CURRENT) openDetail(CURRENT.id,true);
}

/* ---------- alerts while the app is open ---------- */
let RUNG=new Set();
try{ RUNG=new Set(JSON.parse(localStorage.getItem('rung')||'[]')); }catch(e){}
function remember(id){
  RUNG.add(id);
  try{ localStorage.setItem('rung',JSON.stringify([...RUNG].slice(-300))); }catch(e){}
}

function chime(){
  try{
    const A=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.22].forEach((t,i)=>{
      const o=A.createOscillator(), g=A.createGain();
      o.type='sine'; o.frequency.value=i?784:587.33;
      g.gain.setValueAtTime(0.0001,A.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.3,A.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,A.currentTime+t+0.32);
      o.connect(g); g.connect(A.destination);
      o.start(A.currentTime+t); o.stop(A.currentTime+t+0.34);
    });
  }catch(e){}
}

function showAlarm(it){
  document.querySelectorAll('.alarm').forEach(a=>a.remove());
  const c=it.contact_id?CONTACTS.find(x=>x.id===it.contact_id):null;
  const box=document.createElement('div');
  box.className='alarm';
  box.innerHTML=`<h4>${esc(it.title)}</h4>
    <p>${esc(whenText(it))}${c?' &middot; '+esc(fullName(c)):''}</p>
    <button data-open>Open it</button><button data-shut>Dismiss</button>`;
  document.body.appendChild(box);
  box.querySelector('[data-shut]').onclick=()=>box.remove();
  box.querySelector('[data-open]').onclick=()=>{ box.remove(); openDiary(); openItem(it); };
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification(it.title,{body:whenText(it),tag:'item'+it.id}); }catch(e){}
  }
  chime();
}

setInterval(()=>{
  if(!ME) return;
  const now=Date.now();
  ITEMS.filter(it=>!it.done_at && it.remind_at && !RUNG.has(it.id))
       .forEach(it=>{
         const t=new Date(it.remind_at).getTime();
         if(t<=now && now-t < 6*60*60*1000 && !it.pushed_at){ remember(it.id); showAlarm(it); }
       });
}, 30*1000);

/* ============================================================
   Push reminders — these arrive even when the app is closed
   ============================================================ */
let MY_DEVICES=[];

function b64ToBytes(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(raw, c=>c.charCodeAt(0));
}

function pushPossible(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}

// serviceWorker.ready never resolves if the worker failed to register,
// so never wait on it indefinitely.
async function swReady(ms){
  if(!('serviceWorker' in navigator)) return null;
  return await Promise.race([
    navigator.serviceWorker.ready,
    new Promise(r=>setTimeout(()=>r(null), ms||4000))
  ]);
}

async function currentSubscription(){
  if(!pushPossible()) return null;
  const reg=await swReady();
  if(!reg) return null;
  return await reg.pushManager.getSubscription();
}

async function enablePush(){
  if(!pushPossible()){ toast('This browser cannot do push reminders'); return; }
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){ toast('Reminders stayed off'); return; }
  try{
    const reg=await swReady(8000);
    if(!reg){ toast('The background worker is not running — reload the app'); return; }
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:b64ToBytes(VAPID_PUBLIC_KEY)
    });
    const j=sub.toJSON();
    const label=(navigator.userAgentData&&navigator.userAgentData.platform)
      || (/iPhone|iPad/.test(navigator.userAgent)?'iPhone'
         :/Android/.test(navigator.userAgent)?'Android phone':'Computer');
    const {error}=await sb.from('push_subscriptions').upsert({
      user_id:ME.id, endpoint:j.endpoint, keys:j.keys, label
    },{onConflict:'endpoint'});
    if(error){ toast('Could not register this device'); console.error(error); return; }
    await loadDevices();
    toast('Reminders on for this device');
    if(!$('diary').classList.contains('hidden')) renderDiary();
  }catch(e){
    console.error(e);
    toast('This device refused to register for push');
  }
}

async function disablePush(){
  const sub=await currentSubscription();
  if(sub){
    await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);
    await sub.unsubscribe();
  }
  await loadDevices();
  toast('Reminders off for this device');
  if(!$('diary').classList.contains('hidden')) renderDiary();
}

async function loadDevices(){
  const {data}=await sb.from('push_subscriptions').select('*').eq('user_id',ME.id);
  MY_DEVICES=data||[];
}

async function pushCard(){
  const reg=await swReady();
  const sub=await currentSubscription();
  const here=sub && MY_DEVICES.some(d=>d.endpoint===sub.endpoint);
  const others=MY_DEVICES.filter(d=>!sub||d.endpoint!==sub.endpoint);
  return `<div class="card"><h3>Reminders on this device</h3>
    ${!pushPossible()
      ? '<div class="field"><dd>This browser cannot receive reminders. On an iPhone, add the app to your home screen first.</dd></div>'
      : !reg
      ? `<div class="field"><dd>The background worker has not started, so reminders
           cannot be switched on yet. Close the app completely and open it again.
           If it keeps saying this, sw.js may be missing from the site.</dd></div>
         <div class="setadd"><button class="btn" id="pushRetry"
           style="border:1.5px solid var(--rule)">Try again</button></div>`
      : here
        ? `<div class="field"><dd>On. Reminders will reach you even when the app is closed.</dd></div>
           <div class="setadd"><button class="btn" id="pushOff"
             style="border:1.5px solid var(--rule)">Turn them off here</button></div>`
        : `<div class="field"><dd>Off. Turn this on and reminders arrive on the lock
             screen whether or not the app is open.</dd></div>
           <div class="setadd"><button class="btn primary" id="pushOn">Turn on reminders</button></div>`}
    ${others.length?`<div class="field"><dd style="color:var(--muted);font-size:15px">
        Also registered: ${others.map(d=>esc(d.label||'a device')).join(', ')}</dd></div>`:''}
    </div>`;
}

// Every few minutes, but only when nothing is open and you are not typing,
// so it can never interrupt what you are doing.
setInterval(async()=>{
  if(!ME) return;
  if(document.hidden) return;
  if(sheetsOpen()) return;
  if(document.activeElement===$('search')) return;
  const at=window.scrollY;
  await loadAll();
  window.scrollTo(0,at);
}, 5*60*1000);

let AWAY=Date.now();
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden){ AWAY=Date.now(); return; }
  if(!ME) return;
  if(Date.now()-AWAY < 20000) return;          // a quick glance away, leave it alone
  if(!$('editor').classList.contains('hidden')) return;  // never interrupt an edit
  await loadAll();
  if(!$('detail').classList.contains('hidden')&&CURRENT) openDetail(CURRENT.id,true);
});

async function start(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){$('signin').classList.remove('hidden');$('app').classList.add('hidden');return;}
  ME=user;$('signin').classList.add('hidden');$('app').classList.remove('hidden');
  await loadAll();
  loadDevices();
}
start();

if('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js')
    .catch(err=>{ console.error('service worker did not register:',err); });
