<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D4A3A">
<title>Contacts</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contacts">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#10231C; --hull:#1D4A3A; --hull-dark:#14342B; --red:#B3322A;
  --brass:#8A6D12; --paper:#FBFAF7; --panel:#FFF; --rule:#E3E1D8;
  --muted:#5F6B65; --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:17px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--hull)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.hidden{display:none !important}

.plate{background:var(--hull);color:#F2EFE4;padding:calc(14px + env(safe-area-inset-top)) 12px 14px;
  display:flex;align-items:center;gap:4px;border-bottom:3px solid var(--brass)}
.plate h1{margin:0 auto 0 4px;font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.plate button{color:#F2EFE4;font-size:15px;padding:8px 9px;border-radius:8px}
.plate button:hover{background:rgba(255,255,255,.12)}

#topbar{position:sticky;top:0;z-index:25;background:var(--paper)}
.searchwrap{background:var(--paper);
  border-bottom:1px solid var(--rule);padding:12px 16px 8px}
.searchwrap input{width:100%;padding:14px 16px;font-size:18px;
  border:2px solid var(--rule);border-radius:var(--radius);background:var(--panel)}
.searchwrap input:focus{border-color:var(--hull);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1.5px solid var(--rule);
  background:var(--panel);font-size:15px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--hull);border-color:var(--hull);color:#F2EFE4;font-weight:600}

.count{padding:10px 16px 4px;color:var(--muted);font-size:15px}
ul.list{list-style:none;margin:0;padding:0 0 96px}
ul.list li{border-bottom:1px solid var(--rule)}
.grouphd,.countryhd{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:13px 16px}
.grouphd{background:#EDEFEA;font-weight:700}
.countryhd{background:#F5F4EE;padding-left:32px;font-weight:600;color:var(--muted);font-size:15px}
.grouphd .n,.countryhd .n{margin-left:auto;color:var(--muted);font-weight:400;font-size:15px}
.caret{display:inline-block;width:12px}
.open .caret{transform:rotate(90deg)}
.row{width:100%;display:flex;align-items:baseline;gap:12px;padding:15px 16px;text-align:left}
.row.nested{padding-left:32px}
.row:active{background:#F1EFE8}
.row .who{flex:1;min-width:0}
.row .name{font-size:19px;font-weight:600;display:block}
.row .sub{color:var(--muted);font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .bday{font-size:14px;color:var(--brass);font-weight:600;white-space:nowrap}
.row .bday.soon{color:var(--red)}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));
  width:60px;height:60px;border-radius:50%;background:var(--red);color:#fff;
  font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(16,35,28,.3);z-index:30}

.sheet{position:fixed;inset:0;z-index:40;background:var(--paper);
  display:flex;flex-direction:column;overflow:hidden}
.sheet.hidden{display:none}
.sheetbar{flex:0 0 auto;background:var(--hull);color:#F2EFE4;
  display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 12px 12px}
.sheetbar button{color:#F2EFE4;padding:8px 10px;border-radius:8px;font-size:16px}
.sheetbar .title{flex:1;font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px 100px;max-width:640px;margin:0 auto;width:100%}

.detname{font-size:27px;font-weight:700;margin:4px 0 2px;line-height:1.2}
.detsub{color:var(--muted);margin:0 0 14px}
.pins{display:flex;flex-direction:column;gap:4px;margin:0 0 12px}
.pin{display:flex;gap:8px;align-items:baseline;font-size:16px}
.pin .pk{color:var(--muted);font-size:15px}
.pin .pv{font-weight:700;color:var(--hull);padding:0;text-align:left}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.tag{background:#E8EFEA;color:var(--hull);border-radius:999px;padding:4px 11px;font-size:14px;font-weight:600}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.card h3{margin:0;padding:11px 14px;font-size:14px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);background:#F4F2EB;border-bottom:1px solid var(--rule)}
.field{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid #F0EEE7}
.card .field:last-child{border-bottom:none}
.field dt{flex:0 0 38%;color:var(--muted);font-size:15px;margin:0}
.field dd{flex:1;margin:0;word-break:break-word}
.field dd a{text-decoration:none;font-weight:600}

.linkrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #F0EEE7}
.linkrow:last-child{border-bottom:none}
.linkrow .kind{flex:0 0 38%;color:var(--muted);font-size:15px}
.linkrow .to{flex:1;font-weight:600;text-align:left}
.linkrow .del{color:var(--red);font-size:22px;padding:0 6px}
.addlink{padding:12px 14px;display:grid;gap:8px}
.addlink select,.addlink input{padding:11px 12px;border:1.5px solid var(--rule);border-radius:8px;background:#fff;width:100%}
.results{border:1.5px solid var(--rule);border-radius:8px;max-height:180px;overflow-y:auto}
.results button{display:block;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid #F0EEE7}
.results button:last-child{border-bottom:none}

fieldset{border:1px solid var(--rule);border-radius:var(--radius);background:var(--panel);margin:0 0 16px;padding:6px 14px 14px}
legend{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 6px}
label{display:block;margin-top:12px;font-size:15px;color:var(--muted)}
label input,label textarea,label select{display:block;width:100%;margin-top:4px;padding:11px 12px;
  border:1.5px solid var(--rule);border-radius:8px;background:#fff}
label input:focus,label textarea:focus{border-color:var(--hull);outline:none}
input[name="postcode"]{text-transform:uppercase}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.checks label{margin:0;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;
  border:1.5px solid var(--rule);border-radius:999px;background:#fff;color:var(--ink)}
.checks input{width:auto;margin:0}

.multi{margin-top:10px}
.mrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.mrow select{flex:0 0 34%;min-width:0;padding:11px 6px;border:1.5px solid var(--rule);border-radius:8px;background:#fff}
.mrow input{flex:1;min-width:0;padding:11px 12px;border:1.5px solid var(--rule);border-radius:8px;background:#fff}
.mrow .x{flex:0 0 auto;color:var(--red);font-size:24px;padding:0 6px}
.addmore{color:var(--hull);font-weight:700;padding:8px 0;font-size:16px}

.map{height:220px;border-radius:8px;border:1.5px solid var(--rule);margin-top:10px}
.map.detail{height:170px;margin:0;border:none;border-radius:0}
.leaflet-container{z-index:0}
.geo{display:flex;gap:8px;margin-top:12px}
.geo input{flex:1;min-width:0;padding:11px 12px;border:1.5px solid var(--rule);border-radius:8px;background:#fff}
.geo button{flex:0 0 auto;padding:11px 16px;border-radius:8px;background:var(--hull);color:#F2EFE4;font-weight:600}
.coords{margin:8px 0 0;font-size:14px;color:var(--muted)}

.btn{display:block;width:100%;padding:15px;border-radius:var(--radius);font-size:17px;font-weight:700;text-align:center}
.btn.primary{background:var(--hull);color:#F2EFE4}
.btn.danger{background:none;color:var(--red);border:1.5px solid var(--red);margin-top:12px}
.btn:disabled{opacity:.5}

.setrow{display:flex;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid #F0EEE7}
.setrow input{flex:1;min-width:0;padding:9px 10px;border:1.5px solid var(--rule);border-radius:8px;background:#fff}
.setrow .x{flex:0 0 auto;color:var(--red);font-size:22px;padding:0 4px}
.setrow .mv{color:var(--hull);font-size:11px;line-height:1.1;padding:1px 4px}
.setrow .mv:disabled{opacity:.25}
.setrow .scope{flex:0 0 auto;font-size:13px;color:var(--muted)}
.setadd{padding:12px 14px}
.setadd input{width:100%;padding:11px 12px;border:1.5px solid var(--rule);border-radius:8px;
  background:#fff;margin-bottom:8px}

.signin{max-width:380px;margin:0 auto;padding:56px 24px}
.signin h2{font-size:24px;margin:0 0 6px}
.signin p{color:var(--muted);margin:0 0 24px}
.msg{padding:12px 14px;border-radius:8px;margin-bottom:14px;font-size:16px}
.msg.error{background:#FBE9E7;color:#7E241E}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));
  background:var(--hull-dark);color:#F2EFE4;padding:12px 20px;border-radius:999px;z-index:60;
  font-size:16px;box-shadow:0 4px 14px rgba(16,35,28,.3)}
</style>
</head>
<body>

<div id="signin" class="signin">
  <h2>Contacts</h2>
  <p>Sign in to continue.</p>
  <div id="signinMsg"></div>
  <label>Email<input id="email" type="email" autocomplete="username" inputmode="email"></label>
  <label>Password<input id="password" type="password" autocomplete="current-password"></label>
  <br><button class="btn primary" id="signinBtn">Sign in</button>
</div>

<div id="app" class="hidden">
  <div id="topbar">
  <header class="plate">
    <h1>Contacts</h1>
    <button id="sortBtn">Grouped</button>
    <button id="setBtn">Settings</button>
    <button id="signoutBtn">Sign out</button>
  </header>
  <div class="searchwrap">
    <input id="search" type="search" placeholder="Search name, boat, town, notes" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
  </div>
  <p class="count" id="count"></p>
  <ul class="list" id="list"></ul>
  <button class="fab" id="addBtn" aria-label="Add a contact">+</button>
</div>

<div id="detail" class="sheet hidden">
  <div class="sheetbar"><button id="detBack">Back</button>
    <span class="title" id="detTitle"></span><button id="detEdit">Edit</button></div>
  <div class="sheetbody" id="detBody"></div>
</div>

<div id="editor" class="sheet hidden">
  <div class="sheetbar"><button id="edCancel">Cancel</button>
    <span class="title" id="edTitle">Add a contact</span><button id="edSave">Save</button></div>
  <div class="sheetbody" id="edBody"></div>
</div>

<div id="settings" class="sheet hidden">
  <div class="sheetbar"><button id="setBack">Back</button>
    <span class="title">Settings</span><span style="width:56px"></span></div>
  <div class="sheetbody" id="setBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   SETTINGS — paste your two values here.
   ============================================================ */
const SUPABASE_URL = 'https://uloptfmzydaxymhecuub.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ffHo4CL3bl3m207Cjpf6RA_qqYIxUzc';
/* ========================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const LAB = {
  phones:  ['Mobile','Home','Work','Boat','Other'],
  emails:  ['Personal','Work','Other'],
  websites:['Website','Blog','Business','Other'],
  socials: ['Facebook','Instagram','Bluesky','X','LinkedIn','YouTube','WhatsApp','TikTok','Other'],
  pets:    ['Dog']   // replaced from the pet_types table on load
};

let ME=null, GROUPS=[], STATUSES=[], KINDS=[], CONTACTS=[], LINKS=[], TAGS={};
let USERS=[], SHARES=[], PETS=[], PENDING=null;
let FILTER=null, MODE='grouped', CURRENT=null, OPEN=new Set(), MAPS=[], DRAFT={};

const $  = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = v => Array.isArray(v) ? v : [];

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;
  d.setAttribute('role','status');document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}

const CAPS=['first_name','last_name','given_names','nickname','address','address_2',
  'town','county','country','boat_name','met_where','company','employer_name',
  'job_title','department'];
function titleCase(v){
  return String(v).replace(/\S+/g, w => /[A-Z]/.test(w) ? w : w.charAt(0).toUpperCase()+w.slice(1));
}

function fullName(c){if(c.is_organisation&&c.company)return c.company;
  return [c.first_name,c.last_name].filter(Boolean).join(' ')||c.company||'(no name)';}
function fmtDate(d){if(!d)return'';const [y,m,day]=d.split('-').map(Number);
  return new Date(y,m-1,day).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
function ageOf(c){if(!c.birth_date)return null;
  const b=new Date(c.birth_date),e=c.death_date?new Date(c.death_date):new Date();
  let a=e.getFullYear()-b.getFullYear();const m=e.getMonth()-b.getMonth();
  if(m<0||(m===0&&e.getDate()<b.getDate()))a--;return a;}
function daysToBirthday(c){if(!c.birth_date||c.death_date)return null;
  const b=new Date(c.birth_date),n=new Date();
  const t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  let x=new Date(t.getFullYear(),b.getMonth(),b.getDate());
  if(x<t)x=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());
  return Math.round((x-t)/86400000);}
function bdayLabel(n){return n===null?'':n===0?'Today':n===1?'Tomorrow':n+' days';}
function w3wUrl(w){return 'https://what3words.com/'+String(w).replace(/^\/+/,'');}

/* ---------- load ---------- */
async function loadAll(){
  const [g,s,k,c,l,u,sh,pt]=await Promise.all([
    sb.from('groups').select('*').order('sort_order'),
    sb.from('statuses').select('*').order('sort_order'),
    sb.from('link_kinds').select('*').order('sort_order'),
    sb.from('contacts').select('*, contact_groups(group_id)'),
    sb.from('relationships').select('*'),
    sb.from('profiles').select('*'),
    sb.from('contact_shares').select('*'),
    sb.from('pet_types').select('*').order('sort_order')
  ]);
  for(const r of [g,s,k,c,l,u,sh]) if(r.error){toast('Could not load data');console.error(r.error);return;}
  GROUPS=g.data||[];STATUSES=s.data||[];KINDS=k.data||[];CONTACTS=c.data||[];LINKS=l.data||[];
  USERS=(u.data||[]).filter(p=>p.id!==ME.id);SHARES=sh.data||[];
  PETS=pt.data||[];
  if(PETS.length)LAB.pets=PETS.map(t=>t.name);
  TAGS={};CONTACTS.forEach(x=>TAGS[x.id]=(x.contact_groups||[]).map(r=>r.group_id));
  renderChips();render();
}

function renderChips(){
  const w=$('chips');w.innerHTML='';
  const add=(t,v)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.setAttribute('aria-pressed',FILTER===v);
    b.onclick=()=>{FILTER=v;renderChips();render();};w.appendChild(b);};
  add('Everyone',null);GROUPS.forEach(g=>add(g.name,g.id));
}

/* ---------- list ---------- */
function matches(c,q){
  if(!q)return true;
  const bits=[c.first_name,c.last_name,c.given_names,c.nickname,c.boat_name,c.boat_number,
    c.town,c.county,c.country,c.company,c.department,c.job_title,c.met_where,c.notes,
    c.address,c.address_2,c.postcode,c.boat_notes];
  ['emails','phones','websites','socials','pets'].forEach(f=>
    arr(c[f]).forEach(e=>{bits.push(e.value);bits.push(e.label);}));
  const hay=bits.filter(Boolean).join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}
const byName=(a,b)=>fullName(a).localeCompare(fullName(b),'en-GB',{sensitivity:'base'});

function rowHtml(c,nested){
  const d=daysToBirthday(c);
  const sub=[c.nickname&&'"'+c.nickname+'"',c.boat_name,c.town,c.company].filter(Boolean).join(' \u00b7 ');
  return `<li><button class="row ${nested?'nested':''}" data-id="${c.id}">
    <span class="who"><span class="name">${esc(fullName(c))}</span>
    ${sub?`<span class="sub">${esc(sub)}</span>`:''}</span>
    ${d!==null&&d<=45?`<span class="bday ${d<=7?'soon':''}">${bdayLabel(d)}</span>`:''}
  </button></li>`;
}

function render(){
  const q=$('search').value.trim();
  let rows=CONTACTS.filter(c=>matches(c,q));
  if(FILTER)rows=rows.filter(c=>(TAGS[c.id]||[]).includes(FILTER));
  const list=$('list');

  if(!rows.length){
    $('count').textContent='0 contacts';
    list.innerHTML='<li class="empty">'+(q?'Nothing matches that search.':'No contacts yet. Tap + to add the first one.')+'</li>';
    return;
  }

  if(q||MODE!=='grouped'){
    if(MODE==='birthdays'&&!q)
      rows=rows.filter(c=>c.birth_date&&!c.death_date).sort((a,b)=>daysToBirthday(a)-daysToBirthday(b));
    else rows.sort(byName);
    $('count').textContent=rows.length+(rows.length===1?' contact':' contacts');
    list.innerHTML=rows.map(c=>rowHtml(c,false)).join('');
    wireRows();return;
  }

  $('count').textContent=rows.length+(rows.length===1?' contact':' contacts')+', by group and country';
  let html='';
  GROUPS.forEach(g=>{
    const inG=rows.filter(c=>(TAGS[c.id]||[]).includes(g.id));
    if(!inG.length)return;
    const gk='g'+g.id, gOpen=OPEN.has(gk);
    html+=`<li><button class="grouphd ${gOpen?'open':''}" data-open="${gk}">
      <span class="caret">&#9656;</span>${esc(g.name)}<span class="n">${inG.length}</span></button></li>`;
    if(!gOpen)return;
    const countries=[...new Set(inG.map(c=>c.country||'No country'))]
      .sort((a,b)=>a==='No country'?1:b==='No country'?-1:a.localeCompare(b));
    countries.forEach(ct=>{
      const inC=inG.filter(c=>(c.country||'No country')===ct).sort(byName);
      const ck=gk+'|'+ct, cOpen=OPEN.has(ck);
      html+=`<li><button class="countryhd ${cOpen?'open':''}" data-open="${esc(ck)}">
        <span class="caret">&#9656;</span>${esc(ct)}<span class="n">${inC.length}</span></button></li>`;
      if(cOpen)html+=inC.map(c=>rowHtml(c,true)).join('');
    });
  });
  const none=rows.filter(c=>!(TAGS[c.id]||[]).length);
  if(none.length){
    html+=`<li><button class="grouphd ${OPEN.has('none')?'open':''}" data-open="none">
      <span class="caret">&#9656;</span>No group<span class="n">${none.length}</span></button></li>`;
    if(OPEN.has('none'))html+=none.sort(byName).map(c=>rowHtml(c,true)).join('');
  }
  list.innerHTML=html;
  list.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.open;OPEN.has(k)?OPEN.delete(k):OPEN.add(k);render();});
  wireRows();
}
function wireRows(){
  $('list').querySelectorAll('.row').forEach(b=>b.onclick=()=>openDetail(Number(b.dataset.id)));
}

/* ---------- maps ---------- */
function openInMaps(lat,lng){
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
  const url = ios ? `https://maps.apple.com/?q=${lat},${lng}`
                  : `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
  window.open(url,'_blank','noopener');
}

function killMaps(){MAPS.forEach(m=>{try{m.remove();}catch(e){}});MAPS=[];}

function showMap(elId,lat,lng,onMove,useHere){
  if(!$(elId))return null;
  const locked = !onMove;   // a saved record shows a still map, so scrolling works
  const m=L.map(elId,{
    scrollWheelZoom:false,
    dragging:!locked, touchZoom:!locked, doubleClickZoom:!locked,
    boxZoom:!locked, keyboard:!locked, zoomControl:!locked
  }).setView([lat??52.5,lng??-2.0],lat?14:6);
  if(locked&&m.tap)m.tap.disable();
  if(locked&&lat&&lng){
    const el=$(elId);
    el.style.cursor='pointer';
    el.title='Open in your maps app';
    el.addEventListener('click',()=>openInMaps(lat,lng));
  }
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(m);
  let marker=null;
  const drop=(la,ln,tell)=>{
    if(marker)marker.setLatLng([la,ln]);
    else{
      marker=L.marker([la,ln],{draggable:!!onMove}).addTo(m);
      if(onMove)marker.on('dragend',()=>{const p=marker.getLatLng();onMove(p.lat,p.lng);});
    }
    if(tell&&onMove)onMove(la,ln);
  };
  if(lat&&lng)drop(lat,lng,false);
  if(onMove)m.on('click',e=>drop(e.latlng.lat,e.latlng.lng,true));
  MAPS.push(m);
  setTimeout(()=>m.invalidateSize(),150);
  // With nothing recorded yet, start where you are rather than over the Midlands.
  if(!lat&&useHere&&navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{ if(MAPS.includes(m)) m.setView([pos.coords.latitude,pos.coords.longitude],17); },
      ()=>{}, {timeout:8000, maximumAge:300000});
  }
  return {map:m,drop:drop};
}

async function geocode(q,mapObj){
  if(!q.trim()||!mapObj)return;
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));
    const j=await r.json();
    if(!j.length){toast('No match for that address');return;}
    const la=parseFloat(j[0].lat),ln=parseFloat(j[0].lon);
    mapObj.map.setView([la,ln],16);
    mapObj.drop(la,ln,true);
  }catch(e){toast('Address lookup unavailable just now');}
}

function linksFor(id){
  const out=[];
  LINKS.forEach(l=>{
    const k=KINDS.find(x=>x.name===l.kind);
    if(l.from_contact===id)out.push({id:l.id,label:l.kind,other:l.to_contact,owned:true,pinned:l.pinned});
    else if(l.to_contact===id)out.push({id:l.id,label:k?k.inverse_name:l.kind,other:l.from_contact,owned:false,pinned:l.pinned});
  });
  return out;
}

function shareCard(c){
  if(c.created_by!==ME.id)
    return `<div class="card"><h3>Sharing</h3><div class="field"><dd>Shared with you by someone else.
      You can edit it, but only its owner can delete it or change who sees it.</dd></div></div>`;
  if(!USERS.length)
    return `<div class="card"><h3>Sharing</h3><div class="field"><dd>No one else has an account yet.</dd></div></div>`;
  return `<div class="card"><h3>Sharing</h3>
    <div class="field"><dd style="color:var(--muted);font-size:15px">
      Only you can see this unless you tick someone here.</dd></div>
    ${USERS.map(u=>{
      const on=SHARES.some(s=>s.contact_id===c.id&&s.user_id===u.id);
      return `<div class="setrow"><label style="margin:0;display:flex;gap:10px;align-items:center;color:var(--ink);flex:1">
        <input type="checkbox" style="width:auto;margin:0" data-share="${u.id}" ${on?'checked':''}>
        ${esc(u.display_name||u.email)}</label></div>`;
    }).join('')}</div>`;
}

async function toggleShare(uid,on){
  if(on){
    const {error}=await sb.from('contact_shares').insert({contact_id:CURRENT.id,user_id:uid,can_edit:true});
    if(error){toast('Could not share');return;}
    const {data:fresh}=await sb.from('contact_shares').select('*');SHARES=fresh||[];
    offerLinkedShares(uid);
    return;
  }else{
    const {error}=await sb.from('contact_shares').delete()
      .eq('contact_id',CURRENT.id).eq('user_id',uid);
    if(error){toast('Could not stop sharing');return;}
  }
  const {data}=await sb.from('contact_shares').select('*');SHARES=data||[];
  toast(on?'Shared':'No longer shared');
}

function offerLinkedShares(uid){
  // People connected to this one that I own and haven't already shared
  const ids=[...new Set(linksFor(CURRENT.id).map(l=>l.other))];
  const candidates=ids.map(i=>CONTACTS.find(c=>c.id===i))
    .filter(c=>c&&c.created_by===ME.id&&!SHARES.some(s=>s.contact_id===c.id&&s.user_id===uid));
  if(!candidates.length){toast('Shared');return;}

  const who=USERS.find(u=>u.id===uid);
  const box=document.createElement('div');
  box.className='card';
  box.innerHTML=`<h3>Share the connections too?</h3>
    <div class="field"><dd style="color:var(--muted);font-size:15px">
      ${esc(fullName(CURRENT))} is connected to these people, who
      ${esc(who?(who.display_name||who.email):'they')} cannot see.</dd></div>
    ${candidates.map(c=>`<div class="setrow">
      <label style="margin:0;display:flex;gap:10px;align-items:center;color:var(--ink);flex:1">
        <input type="checkbox" style="width:auto;margin:0" data-also="${c.id}" checked>
        ${esc(fullName(c))}</label></div>`).join('')}
    <div class="setadd">
      <button class="btn primary" id="alsoGo">Share the ticked ones</button>
      <button class="addmore" id="alsoSkip">No thanks</button>
    </div>`;
  const anchor=$('detBody');
  anchor.appendChild(box);
  box.scrollIntoView({block:'nearest'});

  $('alsoSkip').onclick=()=>{box.remove();toast('Shared');};
  $('alsoGo').onclick=async()=>{
    const picked=[...box.querySelectorAll('[data-also]:checked')].map(b=>Number(b.dataset.also));
    if(!picked.length){box.remove();return;}
    const {error}=await sb.from('contact_shares')
      .upsert(picked.map(id=>({contact_id:id,user_id:uid,can_edit:true})),
              {onConflict:'contact_id,user_id'});
    if(error){toast('Could not share those');console.error(error);return;}
    const {data}=await sb.from('contact_shares').select('*');SHARES=data||[];
    box.remove();toast('Shared '+(picked.length+1)+' contacts');
  };
}

function wireLinkSearch(){
  const box=$('linkSearch'),res=$('linkResults');
  box.oninput=()=>{
    const q=box.value.trim();
    if(q.length<2){res.classList.add('hidden');return;}
    const hits=CONTACTS.filter(c=>c.id!==CURRENT.id&&matches(c,q)).sort(byName).slice(0,12);
    res.innerHTML=hits.map(c=>`<button data-pick="${c.id}">${esc(fullName(c))}</button>`).join('')
      + `<button data-new-link style="color:var(--hull);font-weight:700">
           + Add &ldquo;${esc(q)}&rdquo; as a new contact</button>`;
    res.classList.remove('hidden');
    res.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>addLink(Number(b.dataset.pick)));
    const nb=res.querySelector('[data-new-link]');
    if(nb)nb.onclick=()=>startLinkedContact(q);
  };
}
function startLinkedContact(q){
  const kind=$('linkKind').value;
  if(!kind){toast('Choose how they are connected first');return;}
  PENDING={from:CURRENT.id,kind:kind};
  const bits=q.trim().split(/\s+/);
  openEditor(null);
  const f=$('edForm');
  f.elements['first_name'].value=bits[0]||'';
  f.elements['last_name'].value=bits.slice(1).join(' ');
}

async function addLink(other){
  const kind=$('linkKind').value;
  if(!kind){toast('Choose how they are connected first');return;}
  const {error}=await sb.from('relationships').insert({from_contact:CURRENT.id,to_contact:other,kind});
  if(error){toast(error.code==='23505'?'That link already exists':'Could not add the link');return;}
  const {data}=await sb.from('relationships').select('*');LINKS=data||[];
  toast('Link added');openDetail(CURRENT.id);
}
async function removeLink(id){
  const {error}=await sb.from('relationships').delete().eq('id',id);
  if(error){toast('Could not remove the link');return;}
  LINKS=LINKS.filter(l=>l.id!==id);toast('Link removed');openDetail(CURRENT.id);
}

function drawMulti(key){

  box.innerHTML=DRAFT[key].map((e,i)=>`<div class="mrow">
    <select data-lab="${key}:${i}">${LAB[key].map(l=>`<option ${l===e.label?'selected':''}>${esc(l)}</option>`).join('')}</select>
    <input data-val="${key}:${i}" value="${esc(e.value||'')}">
    <button type="button" class="x" data-rm="${key}:${i}" aria-label="Remove">&times;</button></div>`).join('');

  box.querySelectorAll('[data-val]').forEach(i=>i.oninput=()=>{

  const showCoords=()=>{
    $('homeCoords').textContent=DRAFT.lat
      ? (+DRAFT.lat).toFixed(6)+', '+(+DRAFT.lng).toFixed(6)+' — drag the pin to adjust'
      : 'Tap the map to drop a pin.';
    $('metCoords').textContent=DRAFT.mlat
      ? (+DRAFT.mlat).toFixed(6)+', '+(+DRAFT.mlng).toFixed(6)+' — drag the pin to adjust'
      : 'Centred on where you are. Tap the map to drop a pin.';
  };
  showCoords();
  $('editor').classList.remove('hidden');$('edBody').scrollTop=0;

  setTimeout(()=>{
    const hm=showMap('homeMap',DRAFT.lat,DRAFT.lng,(la,ln)=>{DRAFT.lat=la;DRAFT.lng=ln;showCoords();});
    const mm=showMap('metEditMap',DRAFT.mlat,DRAFT.mlng,
      (la,ln)=>{DRAFT.mlat=la;DRAFT.mlng=ln;showCoords();}, true);
    $('geoQ').value=buildAddr();
    $('geoQ').addEventListener('input',()=>{addrTouched=true;});
    $('metQ').value=buildMet();
    $('metQ').addEventListener('input',()=>{metTouched=true;});
    $('geoGo').onclick=()=>geocode($('geoQ').value.trim()||buildAddr(),hm);
    $('metGo').onclick=()=>geocode($('metQ').value.trim()||buildMet(),mm);
  },100);

  $('edSave').onclick=()=>saveContact(c);
}

async function saveContact(existing){
  const f=$('edForm'),data={};
  ['first_name','last_name','given_names','nickname','birth_date','death_date','address','address_2',
   'town','county','postcode','country','company','department','job_title','boat_name','boat_number',
   'met_where','met_date','notes','what3words','met_what3words','boat_notes'].forEach(k=>{
    const v=f.elements[k].value.trim();data[k]=v===''?null:v;});
  data.status_id=f.elements['status_id'].value?Number(f.elements['status_id'].value):null;
  Object.keys(LAB).forEach(k=>
    data[k]=DRAFT[k].filter(e=>e.value&&e.value.trim()).map(e=>({label:e.label,value:e.value.trim()})));
  data.latitude=DRAFT.lat;data.longitude=DRAFT.lng;
  data.met_latitude=DRAFT.mlat;data.met_longitude=DRAFT.mlng;

  data.is_organisation=f.elements['is_organisation'].checked;
  if(!data.is_organisation){
    const emp=f.elements['employer_name'].value.trim();
    data.company = emp===''?null:emp;
  }
  if(data.postcode) data.postcode=data.postcode.toUpperCase();
  ['what3words','met_what3words'].forEach(k=>{
    if(data[k]) data[k]=data[k].replace(/^\/+/,'').trim()||null; });
  CAPS.forEach(k=>{ if(data[k]) data[k]=titleCase(data[k]); });
  if(data.is_organisation){
    ['first_name','last_name','given_names','nickname','birth_date','death_date']
      .forEach(k=>data[k]=null);
    data.status_id=null;
  }
  if(!data.first_name&&!data.last_name&&!data.company){
    toast(data.is_organisation?'Give the business a name':'Give them a name, or tick "business"');return;}
  const chosen=[...f.querySelectorAll('input[name="grp"]:checked')].map(b=>Number(b.value));
  if(!chosen.length){toast('Pick at least one group, or only you will see them');return;}

  $('edSave').disabled=true;let id;
  if(existing){
    const {error}=await sb.from('contacts').update(data).eq('id',existing.id);
    if(error){toast('Could not save');console.error(error);$('edSave').disabled=false;return;}
    id=existing.id;
    const before=TAGS[id]||[];
    const add=chosen.filter(g=>!before.includes(g)),go=before.filter(g=>!chosen.includes(g));
    if(add.length)await sb.from('contact_groups')
      .insert(add.map(g=>({contact_id:id,group_id:g,user_id:ME.id})));
    for(const g of go)await sb.from('contact_groups').delete()
      .eq('contact_id',id).eq('group_id',g).eq('user_id',ME.id);
  }else{
    data.created_by=ME.id;
    const {data:ins,error}=await sb.from('contacts').insert(data).select().single();
    if(error){toast('Could not save');console.error(error);$('edSave').disabled=false;return;}
    id=ins.id;
    await sb.from('contact_groups')
      .insert(chosen.map(g=>({contact_id:id,group_id:g,user_id:ME.id})));
  }
  if(PENDING&&!existing){
    await sb.from('relationships').insert({from_contact:PENDING.from,to_contact:id,kind:PENDING.kind});
  }
  const back = PENDING&&!existing ? PENDING.from : id;
  PENDING=null;
  $('edSave').disabled=false;killMaps();$('editor').classList.add('hidden');
  await loadAll();toast('Saved');openDetail(back);
}

async function deleteContact(c){
  if(!confirm('Delete '+fullName(c)+'? This cannot be undone.'))return;
  const {error}=await sb.from('contacts').delete().eq('id',c.id);
  if(error){toast('Could not delete');return;}
  killMaps();$('editor').classList.add('hidden');$('detail').classList.add('hidden');
  await loadAll();toast('Deleted');
}

/* ---------- settings ---------- */
function openSettings(){
  const block=(table,title,one,rows,fields,hint,extra)=>`
    <div class="card"><h3>${title}</h3>
      ${hint?`<div class="field"><dd style="color:var(--muted);font-size:15px">${hint}</dd></div>`:''}
      ${rows.map((r,i)=>`<div class="setrow">
        <span style="display:flex;flex-direction:column;gap:2px">
          <button class="mv" data-mv="${table}:${r.id}:up"   ${i===0?'disabled':''} aria-label="Move up">&#9650;</button>
          <button class="mv" data-mv="${table}:${r.id}:down" ${i===rows.length-1?'disabled':''} aria-label="Move down">&#9660;</button>
        </span>
        ${fields.map(fd=>`<input data-edit="${table}:${r.id}:${fd}" value="${esc(r[fd]??'')}">`).join('')}
        ${table==='groups'?`<span class="scope">${r.owner_id?'mine':'shared'}</span>`:''}
        <button class="x" data-drop="${table}:${r.id}" aria-label="Remove">&times;</button></div>`).join('')}
      <div class="setadd">
        ${fields.map(fd=>`<input data-new="${table}:${fd}" placeholder="${fd==='inverse_name'?'Its opposite, e.g. Child of':'New '+one}">`).join('')}
        ${extra||''}
        <button class="btn primary" data-addrow="${table}">Add ${one}</button>
      </div></div>`;

  $('setBody').innerHTML=
     block('groups','Groups','group',GROUPS,['name'],
       'Shared groups are used by everyone. Your own are private \u2014 no one else sees them, '
       +'and a contact someone shares with you is filed under your groups, not theirs.',
       `<div class="checks" style="margin:0 0 10px"><label>
          <input type="checkbox" id="grpShared"> Everyone can use this group</label></div>`)
   + block('statuses','Relationship statuses','status',STATUSES,['name'])
   + block('pet_types','Kinds of pet','kind',PETS,['name'])
   + block('link_kinds','Connection types','type',KINDS,['name','inverse_name'],
       'Each type has an opposite. Store "Parent of" once and the other person\u2019s record shows "Child of" automatically.')
   + `<div class="card"><h3>Share everything</h3>
      <div class="field"><dd style="color:var(--muted);font-size:15px">
      Gives someone every contact you own, including ones you add later only if you repeat this.</dd></div>
      ${USERS.length?USERS.map(u=>`<div class="setrow">
        <span style="flex:1">${esc(u.display_name||u.email)}</span>
        <button class="addmore" data-shareall="${u.id}">Share all</button></div>`).join('')
        :'<div class="field"><dd>No one else has an account yet.</dd></div>'}
      </div>`
   + `<div class="card"><h3>People who can sign in</h3>
      <div class="field"><dd>Accounts are created in the Supabase dashboard under
      Authentication &rsaquo; Users, then given group access with one line of SQL.
      That can\u2019t be done here safely \u2014 it needs an admin key which must never
      sit in a public web page.</dd></div></div>`;

  $('setBody').querySelectorAll('[data-edit]').forEach(inp=>inp.onchange=async()=>{
    const [t,id,fd]=inp.dataset.edit.split(':');
    const {error}=await sb.from(t).update({[fd]:inp.value.trim()}).eq('id',Number(id));
    if(error){toast('Could not save that change');return;}
    await loadAll();toast('Saved');
  });
  $('setBody').querySelectorAll('[data-drop]').forEach(b=>b.onclick=async()=>{
    const [t,id]=b.dataset.drop.split(':');
    let inUse=0;
    if(t==='groups')     inUse=CONTACTS.filter(c=>(TAGS[c.id]||[]).includes(Number(id))).length;
    if(t==='statuses')   inUse=CONTACTS.filter(c=>c.status_id===Number(id)).length;
    if(t==='link_kinds'){
      const k=KINDS.find(x=>x.id===Number(id));
      inUse=k?LINKS.filter(l=>l.kind===k.name).length:0;
    }
    const warn = inUse
      ? inUse+' contact'+(inUse===1?'':'s')+' currently use this. Remove it anyway?\n\n'
        +'They keep all their other details — they just lose this one setting.'
      : 'Remove this?';
    if(!confirm(warn))return;
    const {error}=await sb.from(t).delete().eq('id',Number(id));
    if(error){toast('Could not remove \u2014 it may still be in use');return;}
    await loadAll();openSettings();toast('Removed');
  });
  $('setBody').querySelectorAll('[data-mv]').forEach(b=>b.onclick=async()=>{
    const [t,id,dir]=b.dataset.mv.split(':');
    const rows=[...(t==='groups'?GROUPS:t==='statuses'?STATUSES:t==='pet_types'?PETS:KINDS)];
    const i=rows.findIndex(r=>r.id===Number(id));
    const j=dir==='up'?i-1:i+1;
    if(i<0||j<0||j>=rows.length)return;
    rows.splice(j,0,rows.splice(i,1)[0]);
    // Renumber the whole list. Swapping two values fails when several share one.
    const res=await Promise.all(rows.map((r,n)=>
      sb.from(t).update({sort_order:(n+1)*10}).eq('id',r.id)));
    if(res.some(r=>r.error)){toast('Could not reorder');console.error(res);return;}
    await loadAll();openSettings();
  });

  $('setBody').querySelectorAll('[data-shareall]').forEach(b=>b.onclick=async()=>{
    const uid=b.dataset.shareall;
    const mineIds=CONTACTS.filter(c=>c.created_by===ME.id).map(c=>c.id);
    if(!mineIds.length){toast('You have no contacts of your own yet');return;}
    if(!confirm('Share all '+mineIds.length+' of your contacts with this person?'))return;
    const {error}=await sb.from('contact_shares')
      .upsert(mineIds.map(id=>({contact_id:id,user_id:uid,can_edit:true})),
              {onConflict:'contact_id,user_id'});
    if(error){toast('Could not share them all');console.error(error);return;}
    const {data}=await sb.from('contact_shares').select('*');SHARES=data||[];
    toast('Shared '+mineIds.length+' contacts');
  });

  $('setBody').querySelectorAll('[data-addrow]').forEach(b=>b.onclick=async()=>{
    const t=b.dataset.addrow,rec={};
    $('setBody').querySelectorAll('[data-new^="'+t+':"]').forEach(inp=>{
      rec[inp.dataset.new.split(':')[1]]=inp.value.trim();});
    if(!rec.name){toast('Give it a name');return;}
    if(t==='link_kinds'&&!rec.inverse_name)rec.inverse_name=rec.name;
    if(t==='groups')rec.owner_id=$('grpShared').checked?null:ME.id;
    const {error}=await sb.from(t).insert(rec);
    if(error){toast('Could not add \u2014 that name may already exist');return;}
    await loadAll();openSettings();toast('Added');
  });
  $('settings').classList.remove('hidden');$('setBody').scrollTop=0;
}

/* ---------- wiring ---------- */
$('signinBtn').onclick=async()=>{
  const b=$('signinBtn');b.disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  b.disabled=false;
  if(error){$('signinMsg').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';return;}
  start();
};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('signinBtn').click();});
$('signoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload();};
$('search').oninput=render;
$('addBtn').onclick=()=>openEditor(null);
$('detBack').onclick=()=>{killMaps();$('detail').classList.add('hidden');};
$('detEdit').onclick=()=>openEditor(CURRENT);
$('edCancel').onclick=()=>{PENDING=null;killMaps();$('editor').classList.add('hidden');};
$('setBtn').onclick=openSettings;
$('setBack').onclick=()=>$('settings').classList.add('hidden');
$('sortBtn').onclick=()=>{
  MODE = MODE==='grouped'?'az':MODE==='az'?'birthdays':'grouped';
  $('sortBtn').textContent = MODE==='grouped'?'Grouped':MODE==='az'?'A\u2013Z':'Birthdays';
  render();
};

async function start(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){$('signin').classList.remove('hidden');$('app').classList.add('hidden');return;}
  ME=user;$('signin').classList.add('hidden');$('app').classList.remove('hidden');
  await loadAll();
}
start();

if('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
