<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D4A3A">
<title>Contacts</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contacts">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#10231C; --hull:#1D4A3A; --hull-dark:#14342B; --red:#B3322A;
  --brass:#8A6D12; --paper:#FBFAF7; --panel:#FFF; --rule:#E3E1D8;
  --muted:#5F6B65; --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:17px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--hull)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.hidden{display:none !important}

.plate{background:var(--hull);color:#F2EFE4;padding:calc(14px + env(safe-area-inset-top)) 12px 14px;
  display:flex;align-items:center;gap:4px;border-bottom:3px solid var(--brass)}
.plate h1{margin:0 auto 0 4px;font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.plate button{color:#F2EFE4;font-size:15px;padding:8px 9px;border-radius:8px}
.plate select{background:rgba(255,255,255,.14);color:#F2EFE4;border:1px solid rgba(255,255,255,.3);
  border-radius:8px;padding:7px 6px;font-size:15px;min-width:0;max-width:40vw}
.plate h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){
  .plate h1{display:none}
  .plate{gap:6px;justify-content:space-between}
  .plate select{max-width:none;flex:1 1 auto}
  .plate button{padding:8px 7px;font-size:14px;flex:0 0 auto}
}
body{overflow-x:hidden}
.plate select option{color:var(--ink);background:#fff}
.plate button:hover{background:rgba(255,255,255,.12)}

#topbar{position:sticky;top:0;z-index:25;background:var(--paper)}
.searchwrap{background:var(--paper);
  border-bottom:1px solid var(--rule);padding:12px 16px 8px}
.searchwrap input{width:100%;padding:14px 16px;font-size:18px;
  border:2px solid var(--rule);border-radius:var(--radius);background:var(--panel)}
.searchwrap input:focus{border-color:var(--hull);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1.5px solid var(--rule);
  background:var(--panel);font-size:15px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--hull);border-color:var(--hull);color:#F2EFE4;font-weight:600}

.count{padding:10px 16px 4px;color:var(--muted);font-size:15px}
ul.list{list-style:none;margin:0;padding:0 0 96px}
ul.list li{border-bottom:1px solid var(--rule)}
.grouphd,.countryhd{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:13px 16px}
.grouphd{background:#EDEFEA;font-weight:700}
.countryhd{background:#F5F4EE;padding-left:32px;font-weight:600;color:var(--muted);font-size:15px}
.grouphd .n,.countryhd .n{margin-left:auto;color:var(--muted);font-weight:400;font-size:15px}
.caret{display:inline-block;width:12px}
.open .caret{transform:rotate(90deg)}
.row{width:100%;display:flex;align-items:flex-start;gap:12px;padding:13px 16px;text-align:left}
.row.nested{padding-left:32px}
ul.list li.alt{background:#F3F1EA}
.row:active{background:#E8E5DC}
.row .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .name{font-size:19px;font-weight:600;line-height:1.25}
.row .rel{color:#37564A;font-size:15px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{color:var(--muted);font-size:15px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .bday{font-size:14px;color:var(--brass);font-weight:600;white-space:nowrap;
  text-align:right;line-height:1.3;padding-top:2px}
.row .bday.soon{color:var(--red)}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));
  width:60px;height:60px;border-radius:50%;background:var(--red);color:#fff;
  font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(16,35,28,.3);z-index:30}

.sheet{position:fixed;inset:0;z-index:40;background:var(--paper);
  display:flex;flex-direction:column;overflow:hidden}
.sheet.hidden{display:none}
.sheetbar{flex:0 0 auto;background:var(--hull);color:#F2EFE4;
  display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 12px 12px}
.sheetbar button{color:#F2EFE4;padding:8px 10px;border-radius:8px;font-size:16px}
.sheetbar .title{flex:1;font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px 100px;max-width:640px;margin:0 auto;width:100%}
#edBody{max-width:1080px}
@media (min-width:900px){
  #edBody form{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:start}
  #edBody .colA,#edBody .colB{min-width:0}
  #edBody .btn.danger{grid-column:1 / -1;max-width:340px}
}

.detname{font-size:27px;font-weight:700;margin:4px 0 2px;line-height:1.2}
.detsub{color:var(--muted);margin:0 0 14px}
details.inpanel{border-top:1px solid #F0EEE7}
details.inpanel>summary{padding:11px 14px;color:var(--hull);font-weight:600;cursor:pointer;font-size:15px}
details#dtFormer{margin-top:14px;border:1.5px solid var(--rule);border-radius:8px;background:#FBFAF7}
details#dtFormer>summary{padding:11px 12px;color:var(--hull);font-weight:600;cursor:pointer}
details#dtFormer .multi{padding:0 12px 12px}

.avatarwrap{display:flex;gap:14px;align-items:center;margin:4px 0 10px}
.avatar{width:74px;height:74px;border-radius:50%;object-fit:cover;flex:0 0 auto;
  border:2px solid var(--rule);background:#EDEFEA}
.avatar.ph{display:flex;align-items:center;justify-content:center;
  font-size:27px;font-weight:700;color:var(--hull)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;padding:12px 14px}
.gallery figure{margin:0;position:relative}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;
  border:1px solid var(--rule);cursor:pointer;display:block}
.gallery .rm{position:absolute;top:2px;right:2px;background:rgba(16,35,28,.72);color:#fff;
  border-radius:50%;width:24px;height:24px;font-size:16px;line-height:1}
.photobar{padding:0 14px 14px;display:flex;gap:10px;flex-wrap:wrap}
.photobar label{margin:0;color:var(--hull);font-weight:700;font-size:16px;cursor:pointer}
.photobar input[type=file]{display:none}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(16,35,28,.94);
  display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lbclose{position:absolute;top:calc(12px + env(safe-area-inset-top));right:16px;
  color:#F2EFE4;font-size:34px;line-height:1;padding:6px 12px}
.pins{display:flex;flex-direction:column;gap:4px;margin:0 0 12px}
.pin{display:flex;gap:8px;align-items:baseline;font-size:16px}
.pin .pk{color:var(--muted);font-size:15px}
.pin .pv{font-weight:700;color:var(--hull);padding:0;text-align:left}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.tag{background:#E8EFEA;color:var(--hull);border-radius:999px;padding:4px 11px;font-size:14px;font-weight:600}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.card h3{margin:0;padding:11px 14px;font-size:14px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);background:#F4F2EB;border-bottom:1px solid var(--rule)}
.field{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid #F0EEE7}
.card .field:last-child{border-bottom:none}
.field dt{flex:0 0 38%;color:var(--muted);font-size:15px;margin:0}
.field dd{flex:1;margin:0;word-break:break-word}
.field dd a{text-decoration:none;font-weight:600}

.linkrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 14px;border-bottom:1px solid #F0EEE7}
.tgs{flex:1 0 100%;display:flex;gap:8px;padding-left:38%;flex-wrap:wrap}
.tg{border:1.5px solid var(--rule);border-radius:999px;padding:5px 12px;
  font-size:14px;color:var(--muted);background:#fff}
.tg[aria-pressed="true"]{background:var(--hull);border-color:var(--hull);
  color:#F2EFE4;font-weight:600}
@media (max-width:480px){.tgs{padding-left:0}}
.linkrow:last-child{border-bottom:none}
.linkrow .kind{flex:0 0 38%;color:var(--muted);font-size:15px}
.linkrow .to{flex:1;font-weight:600;text-align:left}
.linkrow .del{color:var(--red);font-size:22px;padding:0 6px}
.addlink{padding:12px 14px;display:grid;gap:8px}
.addlink select,.addlink input{padding:11px 12px;border:1.5px solid var(--rule);border-radius:8px;background:#fff;width:100%}
.results{border:1.5px solid var(--rule);border-radius:8px;max-height:180px;overflow-y:auto}
.results button{display:block;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid #F0EEE7}
.results button:last-child{border-bottom:none}

fieldset{border:1px solid var(--rule);border-radius:var(--radius);background:var(--panel);margin:0 0 16px;padding:6px 14px 14px}
legend{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 6px}
label{display:block;margin-top:12px;font-size:15px;color:var(--muted)}
label input,label textarea,label select{display:block;width:100%;margin-top:4px;padding:11px 12px;
  border:1.5px solid var(--rule);border-radius:8px;background:#fff}
label input:focus,label textarea:focus{border-color:var(--hull);outline:none}
input[name="postcode"]{text-transform:uppercase}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.checks label{margin:0;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;
  border:1.5px solid var(--rule);border-radius:999px;background:#fff;color:var(--ink)}
.checks input{width:auto;margin:0}

.multi{margin-top:10px}
.mrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.mrow select{flex:0 0 34%;min-width:0;padding:11px 6px;border:1.5px solid var(--rule);border-radius:8px;background:#fff}
.mrow input{flex:1;min-width:0;padding:11px 12px;border:1.5px solid var(--rule);border-radius:8px;background:#fff}
.mrow .x{flex:0 0 auto;color:var(--red);font-size:24px;padding:0 6px}
.addmore{color:var(--hull);font-weight:700;padding:8px 0;font-size:16px}

.map{height:220px;border-radius:8px;border:1.5px solid var(--rule);margin-top:10px}
.map.detail{height:170px;margin:0;border:none;border-radius:0}
.leaflet-container{z-index:0}
.geo{display:flex;gap:8px;margin-top:12px}
.geo input{flex:1;min-width:0;padding:11px 12px;border:1.5px solid var(--rule);border-radius:8px;background:#fff}
.geo button{flex:0 0 auto;padding:11px 16px;border-radius:8px;background:var(--hull);color:#F2EFE4;font-weight:600}
.coords{margin:8px 0 0;font-size:14px;color:var(--muted)}

.btn{display:block;width:100%;padding:15px;border-radius:var(--radius);font-size:17px;font-weight:700;text-align:center}
.btn.primary{background:var(--hull);color:#F2EFE4}
.btn.danger{background:none;color:var(--red);border:1.5px solid var(--red);margin-top:12px}
.btn:disabled{opacity:.5}

.setrow{display:flex;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid #F0EEE7}
.setrow input{flex:1;min-width:0;padding:9px 10px;border:1.5px solid var(--rule);border-radius:8px;background:#fff}
.setrow .x{flex:0 0 auto;color:var(--red);font-size:22px;padding:0 4px}
#dueDot{display:none;margin-left:5px;background:var(--red);color:#fff;border-radius:999px;
  padding:1px 7px;font-size:13px;font-weight:700}
#dueDot.on{display:inline-block}
.dsec{margin:0 0 6px;font-size:14px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);padding:16px 2px 0}
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;
  border-bottom:1px solid #F0EEE7;width:100%;text-align:left}
.card .item:last-child{border-bottom:none}
.item .tick{flex:0 0 auto;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--rule);background:#fff;margin-top:2px}
.item .tick.on{background:var(--hull);border-color:var(--hull);color:#F2EFE4}
.item .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-size:17px;font-weight:600}
.item .t.done{text-decoration:line-through;color:var(--muted);font-weight:400}
.item .w{font-size:15px;color:var(--muted)}
.item .w.late{color:var(--red);font-weight:600}
.item .who2{font-size:15px;color:#37564A}
.kindpick{display:flex;gap:8px;margin:0 0 14px}
.kindpick button{flex:1;padding:12px;border-radius:8px;border:1.5px solid var(--rule);
  background:#fff;font-weight:600;color:var(--muted)}
.kindpick button[aria-pressed="true"]{background:var(--hull);border-color:var(--hull);color:#F2EFE4}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:4px 2px 12px;font-size:18px;font-weight:700}
.mnav button{color:var(--hull);padding:8px 14px;border-radius:8px;font-size:16px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mhd{text-align:center;font-size:13px;font-weight:700;color:var(--muted);padding-bottom:2px}
.mcell{aspect-ratio:1;border:1px solid var(--rule);border-radius:8px;background:var(--panel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.mcell.blank{border:none;background:none}
.mcell .n{font-size:15px;font-weight:600}
.mcell.today{border-color:var(--hull);border-width:2px}
.mcell.picked{background:var(--hull)}
.mcell.picked .n{color:#F2EFE4}
.dots{display:flex;gap:3px;height:7px}
.dots i,i.key{display:inline-block;width:7px;height:7px;border-radius:50%}
i.key{vertical-align:middle}
.dots i.a,i.key.a{background:#0F6E8C}
.dots i.t,i.key.t{background:var(--brass)}
.dots i.l,i.key.l{background:var(--red)}
.alarm{position:fixed;left:12px;right:12px;bottom:calc(20px + env(safe-area-inset-bottom));
  z-index:70;background:var(--hull);color:#F2EFE4;border-radius:12px;padding:16px 18px;
  box-shadow:0 6px 20px rgba(16,35,28,.4)}
.alarm h4{margin:0 0 4px;font-size:18px}
.alarm p{margin:0 0 10px;color:#C8D6CD;font-size:15px}
.alarm button{background:rgba(255,255,255,.16);color:#F2EFE4;border-radius:8px;
  padding:9px 14px;font-weight:600;margin-right:8px}
.menuitem{display:block;width:100%;text-align:left;padding:16px 14px;font-size:17px;
  border-bottom:1px solid #F0EEE7}
.menuitem:last-child{border-bottom:none}
.helpsec h4{margin:22px 0 6px;font-size:17px;color:var(--hull)}
.helpsec p{margin:0 0 10px}
.helpsec ul{margin:0 0 10px;padding-left:20px}
.helpsec li{margin-bottom:5px}
.helpsec .lead{color:var(--muted)}
.setrow .mv{color:var(--hull);font-size:11px;line-height:1.1;padding:1px 4px}
.setrow .mv:disabled{opacity:.25}
.setrow .scope{flex:0 0 auto;font-size:13px;color:var(--muted)}
.setadd{padding:12px 14px}
.setadd input{width:100%;padding:11px 12px;border:1.5px solid var(--rule);border-radius:8px;
  background:#fff;margin-bottom:8px}

.signin{max-width:380px;margin:0 auto;padding:56px 24px}
.signin h2{font-size:24px;margin:0 0 6px}
.signin p{color:var(--muted);margin:0 0 24px}
.msg{padding:12px 14px;border-radius:8px;margin-bottom:14px;font-size:16px}
.msg.error{background:#FBE9E7;color:#7E241E}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));
  background:var(--hull-dark);color:#F2EFE4;padding:12px 20px;border-radius:999px;z-index:60;
  font-size:16px;box-shadow:0 4px 14px rgba(16,35,28,.3)}
</style>
</head>
<body>

<div id="signin" class="signin">
  <h2>Contacts</h2>
  <p>Sign in to continue.</p>
  <div id="signinMsg"></div>
  <label>Email<input id="email" type="email" autocomplete="username" inputmode="email"></label>
  <label>Password<input id="password" type="password" autocomplete="current-password"></label>
  <br><button class="btn primary" id="signinBtn">Sign in</button>
</div>

<div id="app" class="hidden">
  <div id="topbar">
  <header class="plate">
    <h1>Contacts</h1>
    <select id="viewPick" aria-label="How to list contacts">
      <option value="grouped">Grouped</option>
      <option value="az-last">A&ndash;Z by last name</option>
      <option value="az-first">A&ndash;Z by first name</option>
      <option value="az-company">A&ndash;Z by business name</option>
      <option value="birthdays">Birthdays</option>
    </select>
    <button id="diaryBtn">Diary<span id="dueDot"></span></button>
    <button id="menuBtn">Menu</button>
  </header>
  <div class="searchwrap">
    <input id="search" type="search" placeholder="Search name, boat, town, notes" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
  </div>
  <p class="count" id="count"></p>
  <ul class="list" id="list"></ul>
  <button class="fab" id="addBtn" aria-label="Add a contact">+</button>
</div>

<div id="detail" class="sheet hidden">
  <div class="sheetbar"><button id="detBack">Back</button>
    <span class="title" id="detTitle"></span><button id="detEdit">Edit</button></div>
  <div class="sheetbody" id="detBody"></div>
</div>

<div id="editor" class="sheet hidden">
  <div class="sheetbar"><button id="edCancel">Cancel</button>
    <span class="title" id="edTitle">Add a contact</span><button id="edSave">Save</button></div>
  <div class="sheetbody" id="edBody"></div>
</div>

<div id="diary" class="sheet hidden">
  <div class="sheetbar"><button id="diaryBack">Back</button>
    <span class="title">Diary</span><button id="diaryAdd">Add</button></div>
  <div class="sheetbody" id="diaryBody"></div>
</div>

<div id="itemEd" class="sheet hidden">
  <div class="sheetbar"><button id="itCancel">Cancel</button>
    <span class="title" id="itTitle">New</span><button id="itSave">Save</button></div>
  <div class="sheetbody" id="itBody"></div>
</div>

<div id="menu" class="sheet hidden">
  <div class="sheetbar"><button id="menuBack">Back</button>
    <span class="title">Menu</span><span style="width:56px"></span></div>
  <div class="sheetbody">
    <div class="card">
      <button class="menuitem" id="refreshBtn">Refresh from the server</button>
      <button class="menuitem" id="goHelp">How to use this &rsaquo;</button>
      <button class="menuitem" id="setBtn">Settings &rsaquo;</button>
      <button class="menuitem" id="signoutBtn">Sign out</button>
    </div>
    <div class="card"><h3>Your password</h3>
      <div class="field"><dd style="color:var(--muted);font-size:15px">
        Change it to something you will remember. At least eight characters.
        It applies everywhere you sign in.</dd></div>
      <div class="setadd">
        <input id="pw1" type="password" placeholder="New password" autocomplete="new-password">
        <input id="pw2" type="password" placeholder="Type it again" autocomplete="new-password">
        <button class="btn primary" id="pwSave">Change my password</button>
      </div></div>
    <p class="coords" id="whoami"></p>
  </div>
</div>

<div id="help" class="sheet hidden">
  <div class="sheetbar"><button id="helpBack">Back</button>
    <span class="title">How to use this</span><span style="width:56px"></span></div>
  <div class="sheetbody" id="helpBody"></div>
</div>

  <div class="sheetbar"><button id="setBack">Back</button>

function titleCase(v){

function fullName(c){if(c.is_organisation&&c.company)return c.company;

function fmtDate(d){if(!d)return'';const [y,m,day]=d.split('-').map(Number);

function ageOf(c){if(!c.birth_date)return null;
  const b=new Date(c.birth_date),e=c.death_date?new Date(c.death_date):new Date();
  let a=e.getFullYear()-b.getFullYear();const m=e.getMonth()-b.getMonth();

function daysToBirthday(c){if(!c.birth_date||c.death_date)return null;
  const b=new Date(c.birth_date),n=new Date();
  const t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  let x=new Date(t.getFullYear(),b.getMonth(),b.getDate());
  if(x<t)x=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());
  return Math.round((x-t)/86400000);}
function bdayLabel(n){return n===null?'':n===0?'Today':n===1?'Tomorrow':n+' days';}

  const v=String(value||'').trim();
  if(!v) return null;
  if(/^https?:/i.test(v)) return v;
  if(/^[\w.-]+\.[a-z]{2,}\//i.test(v)) return 'https://'+v;
  const build=SOCIAL_URL[label];
  return build ? build(v.replace(/^@/,'')) : null;
}

/* ---------- list ---------- */
function matches(c,q){
  if(!q)return true;
  const bits=[c.first_name,c.last_name,c.given_names,c.nickname,c.boat_name,c.boat_number,
    c.town,c.county,c.country,c.company,c.department,c.job_title,c.met_where,c.notes,
    c.address,c.address_2,c.postcode,c.boat_notes];
  ['emails','phones','websites','socials','pets','former_names'].forEach(f=>
    arr(c[f]).forEach(e=>{bits.push(e.value);bits.push(e.label);}));
  const hay=bits.filter(Boolean).join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}
// The chosen field decides the order. Anyone with that field empty goes to the
// end of the list rather than being sorted under a blank.
function sortKey(c){
  const first=(c.first_name||'').trim();
  const last =(c.last_name ||'').trim();
  const firm =(c.company   ||'').trim();
  const main = SORTBY==='first' ? first : SORTBY==='company' ? firm : last;
  return {blank: main==='', main: main, then: fullName(c)};
}
const byName=(a,b)=>{
  const ka=sortKey(a), kb=sortKey(b);
  if(ka.blank!==kb.blank) return ka.blank?1:-1;
  const r=ka.main.localeCompare(kb.main,'en-GB',{sensitivity:'base'});
  if(r) return r;
  return ka.then.localeCompare(kb.then,'en-GB',{sensitivity:'base'});
};

function dayMonth(d){
  if(!d) return '';
  const [y,m,day]=d.split('-').map(Number);
  return new Date(y,m-1,day).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

// Worked out once per redraw rather than per row
let PINMAP={};
function buildPinMap(){
  PINMAP={};
  const nameOf=id=>{const c=CONTACTS.find(x=>x.id===id);return c?fullName(c):null;};
  LINKS.filter(l=>l.on_tile).forEach(l=>{
    const k=KINDS.find(x=>x.name===l.kind);
    const a=nameOf(l.to_contact), b=nameOf(l.from_contact);
    if(a)(PINMAP[l.from_contact]=PINMAP[l.from_contact]||[]).push(l.kind+' '+a);
    if(b)(PINMAP[l.to_contact]=PINMAP[l.to_contact]||[]).push((k?k.inverse_name:l.kind)+' '+b);
  });
}

function listName(c){
  if(SORTBY==='last' && !c.is_organisation && c.last_name && c.first_name)
    return c.last_name+', '+c.first_name;
  return fullName(c);
}

function rowHtml(c,nested,birthdayView,alt){
  const d=daysToBirthday(c);
  const age=ageOf(c);
  const pins=(PINMAP[c.id]||[]).slice(0,2);

  const detail=[];
  if(c.nickname) detail.push('"'+c.nickname+'"');
  if(age!==null) detail.push(c.death_date?('died at '+age):(age+' yrs'));
  detail.push(c.boat_name, c.town, c.is_organisation?null:c.company);
  const sub=detail.filter(Boolean).join(' \u00b7 ');

  let badge='';
  if(birthdayView&&d!==null)
    badge=`<span class="bday ${d<=7?'soon':''}">${esc(dayMonth(c.birth_date))}<br>${bdayLabel(d)}</span>`;
  else if(d!==null&&d<=45)
    badge=`<span class="bday ${d<=7?'soon':''}">${bdayLabel(d)}</span>`;

  return `<li class="${alt?'alt':''}"><button class="row ${nested?'nested':''}" data-id="${c.id}">
    <span class="who">
      <span class="name">${esc(listName(c))}</span>
      ${pins.length?`<span class="rel">${esc(pins.join(' \u00b7 '))}</span>`:''}
      ${sub?`<span class="sub">${esc(sub)}</span>`:''}
    </span>
    ${badge}
  </button></li>`;
}

let ALT=0;
function render(){
  buildPinMap();
  ALT=0;
  const q=$('search').value.trim();
  let rows=CONTACTS.filter(c=>matches(c,q));
  if(FILTER)rows=rows.filter(c=>(TAGS[c.id]||[]).includes(FILTER));

    $('count').textContent='0 contacts';

  if(q||MODE!=='grouped'){

      rows=rows.filter(c=>c.birth_date&&!c.death_date).sort((a,b)=>daysToBirthday(a)-daysToBirthday(b));

    const bd = MODE==='birthdays'&&!q;
    $('count').textContent=rows.length+(rows.length===1?' contact':' contacts')
      +(bd?', by next birthday':'');
    list.innerHTML=rows.map(c=>rowHtml(c,false,bd,(ALT++)%2===1)).join('');
    wireRows();return;
  }

  $('count').textContent=rows.length+(rows.length===1?' contact':' contacts')+', by group and country';
  let html='';
  GROUPS.forEach(g=>{
    const inG=rows.filter(c=>(TAGS[c.id]||[]).includes(g.id));

    const gk='g'+g.id, gOpen=OPEN.has(gk);

    const countries=[...new Set(inG.map(c=>c.country||'No country'))]
      .sort((a,b)=>a==='No country'?1:b==='No country'?-1:a.localeCompare(b));
    countries.forEach(ct=>{
      const inC=inG.filter(c=>(c.country||'No country')===ct).sort(byName);
      const ck=gk+'|'+ct, cOpen=OPEN.has(ck);
      html+=`<li><button class="countryhd ${cOpen?'open':''}" data-open="${esc(ck)}">
        <span class="caret">&#9656;</span>${esc(ct)}<span class="n">${inC.length}</span></button></li>`;
      if(cOpen)html+=inC.map(c=>rowHtml(c,true,false,(ALT++)%2===1)).join('');
    });
  });
  const none=rows.filter(c=>!(TAGS[c.id]||[]).length);
  if(none.length){
    html+=`<li><button class="grouphd ${OPEN.has('none')?'open':''}" data-open="none">
      <span class="caret">&#9656;</span>No group<span class="n">${none.length}</span></button></li>`;
    if(OPEN.has('none'))html+=none.sort(byName).map(c=>rowHtml(c,true,false,(ALT++)%2===1)).join('');
  }
  list.innerHTML=html;
  list.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.open;OPEN.has(k)?OPEN.delete(k):OPEN.add(k);render();});
  wireRows();
}

let SIGNED={};   // storage path -> temporary viewing URL

async function shrink(file, max){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{
      const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    const scale=Math.min(1, max/Math.max(img.width,img.height));
    const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    return await new Promise(ok=>cv.toBlob(ok,'image/jpeg',0.82));
  } finally { URL.revokeObjectURL(url); }
}

async function signPaths(paths){
  const need=paths.filter(p=>p&&!SIGNED[p]);
  if(!need.length)return;
  const {data,error}=await sb.storage.from('photos').createSignedUrls(need,3600);
  if(error){console.error(error);return;}
  (data||[]).forEach(d=>{ if(d.signedUrl) SIGNED[d.path]=d.signedUrl; });
}

  if(!confirm('Remove this photo?'))return;
  await sb.storage.from('photos').remove([path]);

function openInMaps(lat,lng){
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
  const url = ios ? `https://maps.apple.com/?q=${lat},${lng}`
                  : `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
  window.open(url,'_blank','noopener');
}

/* The Canal & River Trust publish the network as open data.
   Fetched once per session, then reused by every map. */
let CANALS=null, CANALS_TRIED=false;

async function paintCanals(group){
  if(CANALS){ draw(group); return; }
  if(CANALS_TRIED) return;
  CANALS_TRIED=true;
  try{
    const r=await fetch(CANAL_GEOJSON_URL);
    if(!r.ok) throw new Error(r.status);
    CANALS=await r.json();
  }catch(e){
    console.error('canal data',e);
    toast('Could not load the canal network');
    CANALS_TRIED=false;
    return;
  }
  draw(group);

  function draw(g){
    if(!CANALS)return;
    g.clearLayers();
    L.geoJSON(CANALS,{
      style:{color:'#0F6E8C',weight:3,opacity:.85},
      onEachFeature:(f,layer)=>{
        const p=f.properties||{};
        const name=p.SAP_DESCRIPTION||p.Name||p.NAME||p.WATERWAY||p.name;
        if(name) layer.bindTooltip(String(name),{sticky:true});
      }
    }).addTo(g);
  }
}

function killMaps(){MAPS.forEach(m=>{try{m.remove();}catch(e){}});MAPS=[];}

function showMap(elId,lat,lng,onMove,useHere){
  if(!$(elId))return null;
  const locked = !onMove;   // a saved record shows a still map, so scrolling works
  const m=L.map(elId,{
    scrollWheelZoom:false,
    dragging:!locked, touchZoom:!locked, doubleClickZoom:!locked,
    boxZoom:!locked, keyboard:!locked, zoomControl:!locked
  }).setView([lat??52.5,lng??-2.0],lat?14:6);
  if(locked&&m.tap)m.tap.disable();
  if(locked&&lat&&lng){
    const el=$(elId);
    el.style.cursor='pointer';
    el.title='Open in your maps app';
    el.addEventListener('click',()=>openInMaps(lat,lng));
  }
  const layers={
    'Towpaths (CyclOSM)': L.tileLayer(
      'https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',
      {maxZoom:19, attribution:'&copy; OpenStreetMap contributors, CyclOSM'}),
    'Standard map': L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'})
  };
  let want='Towpaths (CyclOSM)';
  try{ want=localStorage.getItem('maplayer')||want; }catch(e){}
  (layers[want]||layers['Standard map']).addTo(m);

  const canals=L.layerGroup();
  L.control.layers(layers,{'UK canal network':canals},{collapsed:true}).addTo(m);
  m.on('baselayerchange',e=>{ try{localStorage.setItem('maplayer',e.name);}catch(err){} });
  m.on('overlayadd',  e=>{ if(e.layer===canals){ paintCanals(canals);
    try{localStorage.setItem('canallayer','on');}catch(err){} } });
  m.on('overlayremove',e=>{ if(e.layer===canals){
    try{localStorage.setItem('canallayer','off');}catch(err){} } });
  let canalOn='on';
  try{ canalOn=localStorage.getItem('canallayer')||'on'; }catch(e){}
  if(canalOn==='on') canals.addTo(m);
  let marker=null;
  const drop=(la,ln,tell)=>{
    if(marker)marker.setLatLng([la,ln]);
    else{
      marker=L.marker([la,ln],{draggable:!!onMove}).addTo(m);
      if(onMove)marker.on('dragend',()=>{const p=marker.getLatLng();onMove(p.lat,p.lng);});
    }
    if(tell&&onMove)onMove(la,ln);
  };
  if(lat&&lng)drop(lat,lng,false);
  if(onMove)m.on('click',e=>drop(e.latlng.lat,e.latlng.lng,true));
  MAPS.push(m);
  setTimeout(()=>m.invalidateSize(),150);
  // With nothing recorded yet, start where you are rather than over the Midlands.
  if(!lat&&useHere&&navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{ if(MAPS.includes(m)) m.setView([pos.coords.latitude,pos.coords.longitude],17); },
      ()=>{}, {timeout:8000, maximumAge:300000});
  }
  return {map:m,drop:drop};
}

async function geocode(q,mapObj){
  if(!q.trim()||!mapObj)return;
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));
    const j=await r.json();
    if(!j.length){toast('No match for that address');return;}
    const la=parseFloat(j[0].lat),ln=parseFloat(j[0].lon);
    mapObj.map.setView([la,ln],16);
    mapObj.drop(la,ln,true);
  }catch(e){toast('Address lookup unavailable just now');}
}

/* ---------- detail ---------- */
function linksFor(id){
  const out=[];
  LINKS.forEach(l=>{
    const k=KINDS.find(x=>x.name===l.kind);
    if(l.from_contact===id)out.push({id:l.id,label:l.kind,other:l.to_contact,
      owned:true,pinned:l.pinned,on_tile:l.on_tile});
    else if(l.to_contact===id)out.push({id:l.id,label:k?k.inverse_name:l.kind,
      other:l.from_contact,owned:false,pinned:l.pinned,on_tile:l.on_tile});
  });
  return out;
}

function shareCard(c){
  if(c.created_by!==ME.id)
    return `<div class="card"><h3>Sharing</h3><div class="field"><dd>Shared with you by someone else.
      You can edit it, but only its owner can delete it or change who sees it.</dd></div></div>`;
  if(!USERS.length)
    return `<div class="card"><h3>Sharing</h3><div class="field"><dd>No one else has an account yet.</dd></div></div>`;
  return `<div class="card"><h3>Sharing</h3>
    <div class="field"><dd style="color:var(--muted);font-size:15px">
      Only you can see this unless you tick someone here.</dd></div>
    ${USERS.map(u=>{
      const on=SHARES.some(s=>s.contact_id===c.id&&s.user_id===u.id);
      return `<div class="setrow"><label style="margin:0;display:flex;gap:10px;align-items:center;color:var(--ink);flex:1">
        <input type="checkbox" style="width:auto;margin:0" data-share="${u.id}" ${on?'checked':''}>
        ${esc(u.display_name||u.email)}</label></div>`;
    }).join('')}</div>`;
}

async function toggleShare(uid,on){
  if(on){
    const {error}=await sb.from('contact_shares').insert({contact_id:CURRENT.id,user_id:uid,can_edit:true});
    if(error){toast('Could not share');return;}
    const {data:fresh}=await sb.from('contact_shares').select('*');SHARES=fresh||[];
    offerLinkedShares(uid);
    return;
  }else{
    const {error}=await sb.from('contact_shares').delete()
      .eq('contact_id',CURRENT.id).eq('user_id',uid);
    if(error){toast('Could not stop sharing');return;}
  }
  const {data}=await sb.from('contact_shares').select('*');SHARES=data||[];
  toast(on?'Shared':'No longer shared');
}

function offerLinkedShares(uid){
  // People connected to this one that I own and haven't already shared
  const ids=[...new Set(linksFor(CURRENT.id).map(l=>l.other))];
  const candidates=ids.map(i=>CONTACTS.find(c=>c.id===i))
    .filter(c=>c&&c.created_by===ME.id&&!SHARES.some(s=>s.contact_id===c.id&&s.user_id===uid));
  if(!candidates.length){toast('Shared');return;}

  const who=USERS.find(u=>u.id===uid);
  const box=document.createElement('div');
  box.className='card';
  box.innerHTML=`<h3>Share the connections too?</h3>
    <div class="field"><dd style="color:var(--muted);font-size:15px">
      ${esc(fullName(CURRENT))} is connected to these people, who
      ${esc(who?(who.display_name||who.email):'they')} cannot see.</dd></div>
    ${candidates.map(c=>`<div class="setrow">
      <label style="margin:0;display:flex;gap:10px;align-items:center;color:var(--ink);flex:1">
        <input type="checkbox" style="width:auto;margin:0" data-also="${c.id}" checked>
        ${esc(fullName(c))}</label></div>`).join('')}
    <div class="setadd">
      <button class="btn primary" id="alsoGo">Share the ticked ones</button>
      <button class="addmore" id="alsoSkip">No thanks</button>
    </div>`;
  const anchor=$('detBody');
  anchor.appendChild(box);
  box.scrollIntoView({block:'nearest'});

  $('alsoSkip').onclick=()=>{box.remove();toast('Shared');};
  $('alsoGo').onclick=async()=>{
    const picked=[...box.querySelectorAll('[data-also]:checked')].map(b=>Number(b.dataset.also));
    if(!picked.length){box.remove();return;}
    const {error}=await sb.from('contact_shares')
      .upsert(picked.map(id=>({contact_id:id,user_id:uid,can_edit:true})),
              {onConflict:'contact_id,user_id'});
    if(error){toast('Could not share those');console.error(error);return;}
    const {data}=await sb.from('contact_shares').select('*');SHARES=data||[];
    box.remove();toast('Shared '+(picked.length+1)+' contacts');
  };
}

function wireLinkSearch(){
  const box=$('linkSearch'),res=$('linkResults');
  box.oninput=()=>{
    const q=box.value.trim();
    if(q.length<2){res.classList.add('hidden');return;}
    const hits=CONTACTS.filter(c=>c.id!==CURRENT.id&&matches(c,q)).sort(byName).slice(0,12);
    res.innerHTML=hits.map(c=>`<button data-pick="${c.id}">${esc(fullName(c))}</button>`).join('')
      + `<button data-new-link style="color:var(--hull);font-weight:700">
           + Add &ldquo;${esc(q)}&rdquo; as a new contact</button>`;
    res.classList.remove('hidden');
    res.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>addLink(Number(b.dataset.pick)));
    const nb=res.querySelector('[data-new-link]');
    if(nb)nb.onclick=()=>startLinkedContact(q);
  };
}
function startLinkedContact(q){
  const kind=$('linkKind').value;
  if(!kind){toast('Choose how they are connected first');return;}
  PENDING={from:CURRENT.id,kind:kind};
  const bits=q.trim().split(/\s+/);
  openEditor(null);
  const f=$('edForm');
  f.elements['first_name'].value=bits[0]||'';
  f.elements['last_name'].value=bits.slice(1).join(' ');
}

const PIN_BY_DEFAULT=/partner|married|engaged|spouse/i;

async function addLink(other){
  const kind=$('linkKind').value;
  if(!kind){toast('Choose how they are connected first');return;}
  const {error}=await sb.from('relationships').insert({
    from_contact:CURRENT.id, to_contact:other, kind,
    pinned: PIN_BY_DEFAULT.test(kind)});
  if(error){toast(error.code==='23505'?'That link already exists':'Could not add the link');return;}
  const {data}=await sb.from('relationships').select('*');LINKS=data||[];
  toast('Link added');openDetail(CURRENT.id,true);
}
async function removeLink(id){
  const {error}=await sb.from('relationships').delete().eq('id',id);
  if(error){toast('Could not remove the link');return;}
  LINKS=LINKS.filter(l=>l.id!==id);toast('Link removed');openDetail(CURRENT.id,true);
}

const F=(l,n,t='text')=>`<label>${l}<input name="${n}" type="${t}"></label>`;

// Offer whatever you have typed before for this field, commonest first
function datalist(id,field){
  const tally={};
  CONTACTS.forEach(c=>{ const v=(c[field]||'').trim(); if(v) tally[v]=(tally[v]||0)+1; });
  const opts=Object.keys(tally).sort((a,b)=>tally[b]-tally[a]||a.localeCompare(b)).slice(0,60);
  return `<datalist id="${id}">${opts.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;
}

function multiBlock(key,word){
  return `<div class="multi"><div class="mrows" id="rows_${key}"></div>
    <button type="button" class="addmore" data-add="${key}">+ Add ${word}</button></div>`;
}
function drawMulti(key){
  const box=$('rows_'+key);if(!box)return;
  box.innerHTML=DRAFT[key].map((e,i)=>`<div class="mrow">
    <select data-lab="${key}:${i}">${LAB[key].map(l=>`<option ${l===e.label?'selected':''}>${esc(l)}</option>`).join('')}</select>
    <input data-val="${key}:${i}" value="${esc(e.value||'')}">
    <button type="button" class="x" data-rm="${key}:${i}" aria-label="Remove">&times;</button></div>`).join('');
  box.querySelectorAll('[data-lab]').forEach(s=>s.onchange=()=>{
    DRAFT[key][Number(s.dataset.lab.split(':')[1])].label=s.value;});
  box.querySelectorAll('[data-val]').forEach(i=>i.oninput=()=>{
    DRAFT[key][Number(i.dataset.val.split(':')[1])].value=i.value;});
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    DRAFT[key].splice(Number(b.dataset.rm.split(':')[1]),1);drawMulti(key);});
}

      <div id="metEditMap" class="map"></div>
      <p class="coords" id="metCoords"></p>
    </fieldset>
    <fieldset id="fsWork"><legend>Work</legend>
      ${F('Company or employer','employer_name')}
      ${F('Department','department')}${F('Job title','job_title')}
    </fieldset>
    <fieldset><legend>Notes</legend>
      <label>Notes<textarea name="notes" rows="4"></textarea></label>
    </fieldset>
   </div>
    ${isNew?'':'<button type="button" class="btn danger" id="edDelete">Delete this contact</button>'}
  </form>`;

  const f=$('edForm');
  if(c){
    Object.keys(c).forEach(k=>{
      if(f.elements[k]&&k!=='id'&&typeof c[k]!=='object')f.elements[k].value=c[k]??'';});
    f.elements['status_id'].value=c.status_id??'';
    f.elements['is_organisation'].checked=!!c.is_organisation;
    $('orgPick').style.display='none';
    const fx=$('orgFixed');
    fx.style.display='';
    fx.innerHTML=(c.is_organisation?'Business or organisation record. ':'Personal record. ')
      +'<button type="button" class="addmore" id="orgSwap" style="padding:0">Change</button>';
    $('orgSwap').onclick=()=>{
      if(!confirm('Switching the record type clears the fields the other type does not use. Continue?'))return;
      $('orgPick').style.display=''; fx.style.display='none';
    };
    f.elements['employer_name'].value=c.is_organisation?'':(c.company??'');
    (TAGS[c.id]||[]).forEach(g=>{const b=f.querySelector(`input[name="grp"][value="${g}"]`);if(b)b.checked=true;});
    $('edDelete').onclick=()=>deleteContact(c);
  }

  CAPS.forEach(k=>{ const el=f.elements[k]; if(el)
    el.addEventListener('blur',()=>{ if(el.value.trim()) el.value=titleCase(el.value); }); });

  const orgBox=f.elements['is_organisation'];
  const applyOrg=()=>{
    const org=orgBox.checked;
    $('personNames').style.display = org?'none':'';
    $('fsPerson').style.display    = org?'none':'';
    $('orgName').style.display     = org?'':'none';
    $('fsWork').style.display      = org?'none':'';
  };
  orgBox.addEventListener('change',applyOrg);

  // keep the address-search box in step with the address fields
  const addrParts=['address','address_2','town','county','postcode','country'];
  const buildAddr=()=>{
    const biz=f.elements['is_organisation'].checked?f.elements['company'].value.trim():'';
    return [biz,...addrParts.map(k=>f.elements[k].value.trim())].filter(Boolean).join(', ');
  };
  let addrTouched=false, metTouched=false;
  const buildMet=()=>f.elements['met_where'].value.trim()||buildAddr();
  const syncAddr=()=>{if(!addrTouched)$('geoQ').value=buildAddr();};
  const syncMet =()=>{if(!metTouched)$('metQ').value=buildMet();};
  addrParts.forEach(k=>f.elements[k].addEventListener('input',()=>{syncAddr();syncMet();}));
  f.elements['company'].addEventListener('input',()=>{syncAddr();syncMet();});
  f.elements['met_where'].addEventListener('input',syncMet);

  const showAge=()=>{
    const b=f.elements['birth_date'].value, d=f.elements['death_date'].value;
    if(!b){$('ageHint').textContent='';return;}
    const a=ageOf({birth_date:b,death_date:d||null});
    $('ageHint').textContent = d ? 'Died at '+a : a+' years old — check the year reads right';
  };
  f.elements['birth_date'].addEventListener('input',showAge);
  f.elements['death_date'].addEventListener('input',showAge);
  showAge();

  applyOrg();
  Object.keys(LAB).forEach(drawMulti);
  if(DRAFT.former_names.length) $('dtFormer').open=true;
  $('edBody').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.add;DRAFT[k].push({label:LAB[k][0],value:''});drawMulti(k);});

  const showCoords=()=>{
    $('homeCoords').textContent=DRAFT.lat
      ? (+DRAFT.lat).toFixed(6)+', '+(+DRAFT.lng).toFixed(6)+' — drag the pin to adjust'
      : 'Tap the map to drop a pin.';
    $('metCoords').textContent=DRAFT.mlat
      ? (+DRAFT.mlat).toFixed(6)+', '+(+DRAFT.mlng).toFixed(6)+' — drag the pin to adjust'
      : 'Centred on where you are. Tap the map to drop a pin.';
  };
  showCoords();
  $('editor').classList.remove('hidden');$('edBody').scrollTop=0;lockBackground();

  setTimeout(()=>{
    const hm=showMap('homeMap',DRAFT.lat,DRAFT.lng,(la,ln)=>{DRAFT.lat=la;DRAFT.lng=ln;showCoords();});
    const mm=showMap('metEditMap',DRAFT.mlat,DRAFT.mlng,
      (la,ln)=>{DRAFT.mlat=la;DRAFT.mlng=ln;showCoords();}, true);
    $('geoQ').value=buildAddr();
    $('geoQ').addEventListener('input',()=>{addrTouched=true;});
    $('metQ').value=buildMet();
    $('metQ').addEventListener('input',()=>{metTouched=true;});
    $('geoGo').onclick=()=>geocode($('geoQ').value.trim()||buildAddr(),hm);
    $('metGo').onclick=()=>geocode($('metQ').value.trim()||buildMet(),mm);
  },100);

  $('edSave').onclick=()=>saveContact(c);
}

async function saveContact(existing){
  const f=$('edForm'),data={};
  ['first_name','last_name','given_names','nickname','birth_date','death_date','address','address_2',
   'town','county','postcode','country','company','department','job_title','boat_name','boat_number',
   'met_where','met_date','notes','what3words','met_what3words','boat_notes'].forEach(k=>{
    const v=f.elements[k].value.trim();data[k]=v===''?null:v;});
  data.status_id=f.elements['status_id'].value?Number(f.elements['status_id'].value):null;
  Object.keys(LAB).forEach(k=>
    data[k]=DRAFT[k].filter(e=>e.value&&e.value.trim()).map(e=>({label:e.label,value:e.value.trim()})));
  data.latitude=DRAFT.lat;data.longitude=DRAFT.lng;
  data.met_latitude=DRAFT.mlat;data.met_longitude=DRAFT.mlng;

  data.is_organisation=f.elements['is_organisation'].checked;
  if(!data.is_organisation){
    const emp=f.elements['employer_name'].value.trim();
    data.company = emp===''?null:emp;
  }
  if(data.postcode) data.postcode=data.postcode.toUpperCase();
  ['what3words','met_what3words'].forEach(k=>{
    if(data[k]) data[k]=data[k].replace(/^\/+/,'').trim()||null; });
  CAPS.forEach(k=>{ if(data[k]) data[k]=titleCase(data[k]); });
  if(data.is_organisation){
    ['first_name','last_name','given_names','nickname','birth_date','death_date']
      .forEach(k=>data[k]=null);
    data.status_id=null;
    data.former_names=[];
  }
  if(!data.first_name&&!data.last_name&&!data.company){
    toast(data.is_organisation?'Give the business a name':'Give them a name, or tick "business"');return;}
  const chosen=[...f.querySelectorAll('input[name="grp"]:checked')].map(b=>Number(b.value));
  if(!chosen.length){toast('Pick at least one group, or only you will see them');return;}

  $('edSave').disabled=true;let id;
  if(existing){
    const {data:done,error}=await sb.from('contacts').update(data)
      .eq('id',existing.id).eq('updated_at',existing.updated_at).select();
    if(error){toast('Could not save');console.error(error);$('edSave').disabled=false;return;}
    if(!done||!done.length){
      $('edSave').disabled=false;
      alert('Someone else changed this contact while you had it open, so nothing '
        +'has been saved \u2014 otherwise your copy would wipe out their change.\n\n'
        +'Their version will be loaded now. Make your change again on top of it.');
      killMaps();$('editor').classList.add('hidden');
      await loadAll(); openDetail(existing.id);
      return;
    }
    id=existing.id;
    const before=TAGS[id]||[];
    const add=chosen.filter(g=>!before.includes(g)),go=before.filter(g=>!chosen.includes(g));
    if(add.length)await sb.from('contact_groups')
      .insert(add.map(g=>({contact_id:id,group_id:g,user_id:ME.id})));
    for(const g of go)await sb.from('contact_groups').delete()
      .eq('contact_id',id).eq('group_id',g).eq('user_id',ME.id);
  }else{
    data.created_by=ME.id;
    const {data:ins,error}=await sb.from('contacts').insert(data).select().single();
    if(error){toast('Could not save');console.error(error);$('edSave').disabled=false;return;}
    id=ins.id;
    await sb.from('contact_groups')
      .insert(chosen.map(g=>({contact_id:id,group_id:g,user_id:ME.id})));
  }
  if(PENDING&&!existing){
    await sb.from('relationships').insert({from_contact:PENDING.from,to_contact:id,
      kind:PENDING.kind, pinned:PIN_BY_DEFAULT.test(PENDING.kind)});
  }
  const back = PENDING&&!existing ? PENDING.from : id;
  PENDING=null;
  $('edSave').disabled=false;killMaps();$('editor').classList.add('hidden');lockBackground();
  await loadAll();toast('Saved');openDetail(back);
}

async function deleteContact(c){
  if(!confirm('Delete '+fullName(c)+'? This cannot be undone.'))return;
  const {error}=await sb.from('contacts').delete().eq('id',c.id);
  if(error){toast('Could not delete');return;}
  killMaps();$('editor').classList.add('hidden');$('detail').classList.add('hidden');
  await loadAll();toast('Deleted');
}

/* ---------- settings ---------- */
function openSettings(){
  const block=(table,title,one,rows,fields,hint,extra)=>`
    <div class="card"><h3>${title}</h3>
      ${hint?`<div class="field"><dd style="color:var(--muted);font-size:15px">${hint}</dd></div>`:''}
      ${rows.map((r,i)=>`<div class="setrow">
        <span style="display:flex;flex-direction:column;gap:2px">
          <button class="mv" data-mv="${table}:${r.id}:up"   ${i===0?'disabled':''} aria-label="Move up">&#9650;</button>
          <button class="mv" data-mv="${table}:${r.id}:down" ${i===rows.length-1?'disabled':''} aria-label="Move down">&#9660;</button>
        </span>
        ${fields.map(fd=>`<input data-edit="${table}:${r.id}:${fd}" value="${esc(r[fd]??'')}">`).join('')}
        ${table==='groups'?`<span class="scope">${r.owner_id?'mine':'shared'}</span>`:''}
        <button class="x" data-drop="${table}:${r.id}" aria-label="Remove">&times;</button></div>`).join('')}
      <div class="setadd">
        ${fields.map(fd=>`<input data-new="${table}:${fd}" placeholder="${fd==='inverse_name'?'Its opposite, e.g. Child of':'New '+one}">`).join('')}
        ${extra||''}
        <button class="btn primary" data-addrow="${table}">Add ${one}</button>
      </div></div>`;

  $('setBody').innerHTML=
     block('groups','Groups','group',GROUPS,['name'],
       'Shared groups are used by everyone. Your own are private \u2014 no one else sees them, '
       +'and a contact someone shares with you is filed under your groups, not theirs.',
       `<div class="checks" style="margin:0 0 10px"><label>
          <input type="checkbox" id="grpShared"> Everyone can use this group</label></div>`)
   + block('statuses','Relationship statuses','status',STATUSES,['name'])
   + block('pet_types','Kinds of pet','kind',PETS,['name'])
   + block('link_kinds','Connection types','type',KINDS,['name','inverse_name'],
       'Each type has an opposite. Store "Parent of" once and the other person\u2019s record shows "Child of" automatically.')
   + `<div class="card"><h3>Which contact is you?</h3>
      <div class="field"><dd style="color:var(--muted);font-size:15px">
      Used to fill in new diary entries.</dd></div>
      <div class="setadd">
        <select id="meContact">
          <option value="">&mdash; not set &mdash;</option>
          ${CONTACTS.slice().sort(byName).map(c=>
            `<option value="${c.id}" ${MY_PROFILE&&MY_PROFILE.my_contact_id===c.id?'selected':''}>${esc(fullName(c))}</option>`).join('')}
        </select>
      </div></div>`
   + `<div class="card"><h3>Share everything</h3>
      <div class="field"><dd style="color:var(--muted);font-size:15px">
      Gives someone every contact you own, including ones you add later only if you repeat this.</dd></div>
      ${USERS.length?USERS.map(u=>`<div class="setrow">
        <span style="flex:1">${esc(u.display_name||u.email)}</span>
        <button class="addmore" data-shareall="${u.id}">Share all</button></div>`).join('')
        :'<div class="field"><dd>No one else has an account yet.</dd></div>'}
      </div>`
   + `<div class="card"><h3>People who can sign in</h3>
      <div class="field"><dd>Accounts are created in the Supabase dashboard under
      Authentication &rsaquo; Users, then given group access with one line of SQL.
      That can\u2019t be done here safely \u2014 it needs an admin key which must never
      sit in a public web page.</dd></div></div>`;

  $('setBody').querySelectorAll('[data-edit]').forEach(inp=>inp.onchange=async()=>{
    const [t,id,fd]=inp.dataset.edit.split(':');
    const {error}=await sb.from(t).update({[fd]:inp.value.trim()}).eq('id',Number(id));
    if(error){toast('Could not save that change');return;}
    await loadAll();toast('Saved');
  });
  $('setBody').querySelectorAll('[data-drop]').forEach(b=>b.onclick=async()=>{
    const [t,id]=b.dataset.drop.split(':');
    let inUse=0;
    if(t==='groups')     inUse=CONTACTS.filter(c=>(TAGS[c.id]||[]).includes(Number(id))).length;
    if(t==='statuses')   inUse=CONTACTS.filter(c=>c.status_id===Number(id)).length;
    if(t==='link_kinds'){
      const k=KINDS.find(x=>x.id===Number(id));
      inUse=k?LINKS.filter(l=>l.kind===k.name).length:0;
    }
    const warn = inUse
      ? inUse+' contact'+(inUse===1?'':'s')+' currently use this. Remove it anyway?\n\n'
        +'They keep all their other details — they just lose this one setting.'
      : 'Remove this?';
    if(!confirm(warn))return;
    const {error}=await sb.from(t).delete().eq('id',Number(id));
    if(error){toast('Could not remove \u2014 it may still be in use');return;}
    await loadAll();openSettings();toast('Removed');
  });
  const mc=$('meContact');
  if(mc) mc.onchange=async()=>{
    const v=mc.value?Number(mc.value):null;
    const {error}=await sb.from('profiles').update({my_contact_id:v}).eq('id',ME.id);
    if(error){toast('Could not save that');return;}
    await loadAll(); toast('Saved');
  };
  $('setBody').querySelectorAll('[data-mv]').forEach(b=>b.onclick=async()=>{
    const [t,id,dir]=b.dataset.mv.split(':');
    const rows=[...(t==='groups'?GROUPS:t==='statuses'?STATUSES:t==='pet_types'?PETS:KINDS)];
    const i=rows.findIndex(r=>r.id===Number(id));
    const j=dir==='up'?i-1:i+1;
    if(i<0||j<0||j>=rows.length)return;
    rows.splice(j,0,rows.splice(i,1)[0]);
    // Renumber the whole list. Swapping two values fails when several share one.
    const res=await Promise.all(rows.map((r,n)=>
      sb.from(t).update({sort_order:(n+1)*10}).eq('id',r.id)));
    if(res.some(r=>r.error)){toast('Could not reorder');console.error(res);return;}
    await loadAll();openSettings();
  });

  $('setBody').querySelectorAll('[data-shareall]').forEach(b=>b.onclick=async()=>{
    const uid=b.dataset.shareall;
    const mineIds=CONTACTS.filter(c=>c.created_by===ME.id).map(c=>c.id);
    if(!mineIds.length){toast('You have no contacts of your own yet');return;}
    if(!confirm('Share all '+mineIds.length+' of your contacts with this person?'))return;
    const {error}=await sb.from('contact_shares')
      .upsert(mineIds.map(id=>({contact_id:id,user_id:uid,can_edit:true})),
              {onConflict:'contact_id,user_id'});
    if(error){toast('Could not share them all');console.error(error);return;}
    const {data}=await sb.from('contact_shares').select('*');SHARES=data||[];
    toast('Shared '+mineIds.length+' contacts');
  });

  $('setBody').querySelectorAll('[data-addrow]').forEach(b=>b.onclick=async()=>{
    const t=b.dataset.addrow,rec={};
    $('setBody').querySelectorAll('[data-new^="'+t+':"]').forEach(inp=>{
      rec[inp.dataset.new.split(':')[1]]=inp.value.trim();});
    if(!rec.name){toast('Give it a name');return;}
    if(t==='link_kinds'&&!rec.inverse_name)rec.inverse_name=rec.name;
    if(t==='groups')rec.owner_id=$('grpShared').checked?null:ME.id;
    const {error}=await sb.from(t).insert(rec);
    if(error){toast('Could not add \u2014 that name may already exist');return;}
    await loadAll();openSettings();toast('Added');
  });
  $('settings').classList.remove('hidden');$('setBody').scrollTop=0;lockBackground();
}


function openHelp(){
  $('helpBody').innerHTML = `
  <div class="helpsec">
  <p class="lead">Everything here is stored online, so you and Sandra see the same
  contacts on any phone, tablet or laptop. You need a signal to use it.</p>

  <h4>Your password</h4>
  <p>Menu &rsaquo; <strong>Your password</strong> changes it to whatever you like.
  It takes effect immediately and applies on every device you sign in on, so if
  you are signed in elsewhere, use the new one there next time.</p>
  <p>There is no "forgotten password" email. If you are locked out, Barry can set
  a new one for you.</p>

  <h4>Setting someone up</h4>
  <p>Send a new user this link. It gives them the address, how to sign in, how
  to add it to their phone, and what is private versus shared:</p>
  <p><a href="${esc(START_LINK)}" target="_blank" rel="noopener">${esc(START_LINK)}</a></p>
  <p><button class="addmore" id="copyStart" style="padding:0">Copy that link</button></p>

  <h4>Finding someone</h4>
  <p>Type into the search box at the top. It looks at names, previous names,
  nicknames, boat names, towns, companies, phone numbers, pets and notes, so
  a half-remembered detail is usually enough. Several words narrow it down:
  <em>burns nz</em> finds the Burnses in New Zealand.</p>
  <p>The coloured buttons under the search box filter by group. Tap
  <strong>Everyone</strong> to clear it.</p>

  <h4>How the list is ordered</h4>
  <p>The dropdown in the green bar has five choices:</p>
  <ul>
    <li><strong>Grouped</strong> &mdash; group, then country, then last name.
        Tap a heading to open or close it.</li>
    <li><strong>A&ndash;Z by last name</strong> &mdash; one list of everyone,
        surname first. Businesses sort under their own name.</li>
    <li><strong>A&ndash;Z by first name</strong> &mdash; handy when you know
        someone as Dickie or Bazza rather than by surname.</li>
    <li><strong>A&ndash;Z by business name</strong> &mdash; marinas, boatyards
        and chandlers only. People are left out of this one.</li>
    <li><strong>Birthdays</strong> &mdash; everyone with a birth date, soonest
        first, showing the day and how long to wait.</li>
  </ul>
  <p>People with nothing in the field you are sorting by go to the end of the
  list rather than being buried under a blank. Sorting by last name lists people
  as <em>Burns, Viv</em>. Ages show beside each name where a birth date is known.</p>
  <p>Your choice is remembered on that device. Searching always shows a flat
  list, whichever setting you are on.</p>

  <h4>Adding someone</h4>
  <p>The red <strong>+</strong> button, bottom right. You must tick at least one
  group before it will save &mdash; a contact with no group is visible only to
  whoever created it, and would never reach the other person.</p>
  <p>For a marina, boatyard or shop, tick <strong>This is a business or
  organisation</strong> at the top. The personal fields disappear and the
  business name becomes the record's name. That tick only appears when adding;
  afterwards there is a Change link if you got it wrong.</p>

  <h4>Lists that grow</h4>
  <p>Phones, emails, websites, social accounts, pets and previous names all work
  the same way: choose a label from the dropdown, type the value, and press
  <strong>+ Add</strong> for another. There is no limit. The &times; removes one.</p>
  <p>Previous names sit in a panel under the birth date. It opens itself when
  there is something inside.</p>

  <h4>Maps</h4>
  <p>Two maps: where they live, and where you met. Tap the map to drop a pin,
  or drag the pin to adjust it.</p>
  <p>The <strong>Find</strong> box fills itself in from the address you have
  typed, so usually you just press Find. Type over it if the pin lands wide.
  The "where we met" map starts at wherever you are, so if you are adding
  someone you have just met, the right spot is already on screen.</p>
  <p>The layers button in a map's top corner switches the base map between the
  towpath map and the standard map, and turns the <strong>UK canal network</strong>
  overlay on or off. The canal lines come from Canal &amp; River Trust open data;
  hover or tap a canal to see its name. Your choices are remembered.</p>
  <p>On a saved contact the map is a still picture, so the page scrolls
  properly. Tap it to open the location in your phone's maps app.</p>

  <h4>Photos</h4>
  <p>The round photo at the top is their profile picture; the gallery further
  down holds as many as you like. Photos are shrunk on your phone before being
  sent, so there is no need to resize anything first. Tap any photo to see it
  full size.</p>

  <h4>Connections</h4>
  <p>At the bottom of a contact, choose how two people are connected, then search
  for the other person. If they are not in the database yet, tap
  <strong>Add &hellip; as a new contact</strong> and the link is made when you save.</p>
  <p>Connections work both ways from a single entry: store "Parent of" on the
  mother and the child's record shows "Child of" by itself.</p>
  <p>Each connection has two buttons. <strong>Top of page</strong> shows it
  beside their name on their own page &mdash; partner, married and engaged links
  switch this on themselves. <strong>On the list</strong> shows it on their line
  in the main list, and is always your own choice, so the list stays readable.

  <h4>Diary</h4>
  <p><strong>Diary</strong> in the green bar holds appointments and to-dos. The
  number beside it is how many are due today or already overdue.</p>
  <p><em>About which contact</em> ties an entry to a person, so it appears on
  their page too. Leave it blank for anything that is not about anybody.</p>
  <p>A <strong>to-do</strong> is due by a time, and can have a "not before" date
  if it shouldn't be started yet. An <strong>appointment</strong> has a start and
  an end. Either can be attached to a contact, in which case it also shows on
  their page, and either can repeat.</p>
  <p>Tap the circle to mark something done. A repeating item rolls forward to its
  next date instead of disappearing.</p>
  <p><strong>Regular</strong> is a standing list of jobs you come back to &mdash;
  engine oil, tax return, paint the shower. Ticking one drops it to the bottom
  with the date you did it; unticking brings it back to the top as needing doing.
  Nothing leaves the list until you remove it with the &times;. Give jobs a

  <p>The other Diary views are for things with a date. <strong>List</strong> groups everything by
  overdue, today, tomorrow and so on. <strong>Week</strong> shows the current
  week day by day. <strong>Month</strong> shows a calendar with a dot on each day
  &mdash; blue for an appointment, brass for a to-do, red if it is overdue.
  Tap a day to see what is on. An appointment with an end date shows on every
  day it covers, so a fortnight away blocks out the whole fortnight.</p>
  <p><strong>Who else to remind</strong> puts the same entry in someone else's
  diary. They can tick it off or change it, so an appointment you are both going
  to only needs entering once.</p>
  <p>New entries fill in your own name under "about which contact". Set who that
  is in Menu &rsaquo; Settings &rsaquo; <em>Which contact is you?</em></p>
  <p>At the bottom of the Diary, <strong>Turn on reminders</strong> registers the
  device you are holding. After that, reminders arrive on the lock screen with a
  sound whether or not the app is open. Do it once on each device you want
  alerted &mdash; your phone and your laptop are separate.</p>
  <p>On an iPhone this only works once the app has been added to the home screen,
  and you must open it from that icon rather than in Safari.</p>

  <h4>Sharing</h4>
  <p>Everything you add is private to you until you share it. On a contact,
  scroll to <strong>Sharing</strong> and tick the person. If that contact is
  connected to others you have not shared, it offers those too.</p>
  <p>Menu &rsaquo; Settings &rsaquo; <strong>Share everything</strong> hands over
  every contact you own in one go. It is not automatic, so anyone added later
  needs sharing as well.</p>
  <p>Someone you share with can edit the contact but cannot delete it, and they
  file it under their own groups, not yours.</p>

  <h4>Settings</h4>
  <p>Groups, relationship statuses, connection types and kinds of pet are all
  editable. Use the small arrows to reorder them &mdash; that order is what the
  grouped view follows.</p>
  <p>A group can be shared by everyone, or private to you. Tick the box when
  adding it. Removing something tells you how many contacts use it first;
  their other details are never touched.</p>
  <p>New sign-in accounts are the one thing not done here. They are created in
  the Supabase dashboard.</p>

  <h4>If something looks wrong</h4>
  <ul>
    <li>Close the app fully and reopen it. It reloads everything on start.</li>
    <li>A blank map usually means the canal tile server is busy. Switch layers.</li>
    <li>The app refreshes itself every few minutes while it is sitting open, and
        whenever you come back to it. Menu &rsaquo; <strong>Refresh from the
        server</strong> fetches the latest at any time.</li>
    <li>If two of you edit the same contact at once, the second save is stopped
        and you are shown the other version rather than quietly overwriting it.</li>
    <li>A contact you cannot find may be one you have not been shared.</li>
  </ul>
  </div>`;
  const cs=$('copyStart');
