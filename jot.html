<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2E5E63">
<title>MY Jotter</title>
<link rel="manifest" href="manifest-jot.json">
<link rel="apple-touch-icon" href="apple-touch-icon-jot.png">
<link rel="icon" href="favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MY Jotter">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10231C; --hull:#2E5E63; --hull-dark:#1F4347; --red:#B3322A;
  --brass:#8A6D12; --paper:#FBFAF7; --panel:#FFF; --rule:#E3E1D8;
  --muted:#5F6B65; --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:17px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

.bar{background:var(--hull);color:#F2EFE4;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  position:sticky;top:0;z-index:5;border-bottom:3px solid var(--brass)}
.bar h1{flex:1;margin:0;font-size:20px;font-weight:700;letter-spacing:.01em}
.bar button{color:#F2EFE4;padding:7px 10px;border-radius:8px;font-size:16px;
  border:1.5px solid rgba(255,255,255,.45)}
.bar button[aria-pressed="true"]{background:#F2EFE4;color:var(--hull);border-color:#F2EFE4}

main{max-width:620px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);
  margin-bottom:14px;overflow:hidden}
.card h2{margin:0;padding:10px 14px;font-size:13px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);background:#F4F2EB;
  border-bottom:1px solid var(--rule)}
label.f{display:block;padding:10px 14px;border-bottom:1px solid #F0EEE7}
label.f:last-child{border-bottom:none}
label.f span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
label.f input,label.f textarea{width:100%;padding:11px 12px;border:1.5px solid var(--rule);
  border-radius:8px;background:#fff}
label.f input:focus,label.f textarea:focus{outline:2px solid var(--hull);outline-offset:1px}
.two{display:flex;gap:0}
.two label.f{flex:1}
.two label.f:first-child{border-right:1px solid #F0EEE7}

.btn{display:block;width:100%;padding:16px;border-radius:var(--radius);
  font-size:18px;font-weight:700;text-align:center}
.btn.go{background:var(--hull);color:#F2EFE4}
.btn.ghost{border:1.5px solid var(--rule);background:#fff}
.btn:disabled{opacity:.5}

.shot{display:flex;gap:12px;align-items:center;padding:12px 14px}
.shot .pic{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:0 0 auto;
  border:1.5px solid var(--rule);background:#EDEFEA}
.shot .pick{flex:1}
.shot .pick b{display:block}
.shot .pick small{color:var(--muted)}
.shot input[type=file]{display:none}
.shot .act{border:1.5px solid var(--rule);border-radius:8px;padding:10px 14px;
  background:#fff;font-weight:600}

.note{padding:10px 14px;font-size:15px;color:var(--muted)}
.strip{padding:11px 14px;font-size:15px;border-radius:var(--radius);margin-bottom:14px}
.strip.ok{background:#E7F0E9;color:#1D4A3A;border:1px solid #BFD8C6}
.strip.warn{background:#FBF1D9;color:#6B5219;border:1px solid #E8D39A}
.strip.bad{background:#FBE9E7;color:#7E241E;border:1px solid #E8BDB8}
.strip a{color:inherit;font-weight:700}
.strip button{text-decoration:underline;font-weight:700;color:inherit}

.hit{display:flex;gap:10px;align-items:center;padding:11px 14px;width:100%;
  text-align:left;border-bottom:1px solid #F0EEE7}
.hit:last-child{border-bottom:none}
.hit .av{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:0 0 auto;
  border:1.5px solid var(--rule);background:#EDEFEA;display:flex;
  align-items:center;justify-content:center;font-weight:700;color:var(--hull)}
.hit .who{flex:1;min-width:0}
.hit .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .who span{display:block;color:var(--muted);font-size:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .go{flex:0 0 auto;color:var(--hull);font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(22px + env(safe-area-inset-bottom));background:var(--hull-dark);
  color:#F2EFE4;padding:12px 20px;border-radius:999px;z-index:60;font-size:16px;
  box-shadow:0 4px 14px rgba(16,35,28,.3);max-width:92vw;text-align:center}
.hidden{display:none!important}
.empty{padding:26px 14px;text-align:center;color:var(--muted)}
footer{text-align:center;padding:4px 14px 30px;color:var(--muted);font-size:15px}
footer a{color:var(--hull);font-weight:600}
</style>
</head>
<body>

<div class="bar">
  <h1>MY Jotter</h1>
  <button id="tabAdd"  aria-pressed="true">Add</button>
  <button id="tabFind" aria-pressed="false">Find</button>
</div>

<main>
  <div id="status"></div>

  <!-- ---------------- Adding somebody ---------------- -->
  <section id="addPane">
    <div class="card">
      <h2>Who you have just met</h2>
      <div class="two">
        <label class="f"><span>First name</span>
          <input id="fFirst" autocomplete="off" enterkeyhint="next"></label>
        <label class="f"><span>Last name</span>
          <input id="fLast" autocomplete="off" enterkeyhint="next"></label>
      </div>
      <label class="f"><span>Boat name</span>
        <input id="fBoat" autocomplete="off" enterkeyhint="next"></label>
      <label class="f"><span>Phone</span>
        <input id="fPhone" type="tel" autocomplete="off" enterkeyhint="next"></label>
    </div>

    <div class="card">
      <h2>Photo</h2>
      <div class="shot">
        <img id="shotPic" class="pic" alt="" hidden>
        <span id="shotPh" class="pic" aria-hidden="true">&#128247;</span>
        <span class="pick"><b id="shotName">No photo yet</b>
          <small>Of them, their boat, or a scrap of paper</small></span>
        <label class="act">Camera<input type="file" id="fShot" accept="image/*" capture="environment"></label>
      </div>
      <div class="note" style="padding-top:0">
        <button id="shotPickAny" style="text-decoration:underline;font-weight:600;color:var(--hull)">Choose one already on the phone</button>
        <input type="file" id="fShotAny" accept="image/*" style="display:none">
        <button id="shotDrop" class="hidden" style="text-decoration:underline;font-weight:600;color:var(--red);margin-left:12px">Remove</button>
      </div>
    </div>

    <div class="card">
      <h2>Where and when</h2>
      <label class="f"><span>Where you met</span>
        <input id="fWhere" autocomplete="off" placeholder="Hatton flight, the Rose &amp; Crown&hellip;"></label>
      <label class="f"><span>Date</span>
        <input id="fDate" type="date"></label>
      <div class="note" id="gpsNote">Looking for your position&hellip;</div>
    </div>

    <div class="card">
      <h2>Anything worth remembering</h2>
      <label class="f"><span>Notes</span>
        <textarea id="fNotes" rows="3" placeholder="Heading north, two spaniels, swapped numbers at the lock"></textarea></label>
    </div>

    <button class="btn go" id="save">Save</button>
    <button class="btn ghost" id="clear" style="margin-top:10px">Clear the form</button>

    <div id="recent"></div>
  </section>

  <!-- ---------------- Looking somebody up ---------------- -->
  <section id="findPane" class="hidden">
    <div class="card">
      <label class="f"><span>Name or boat</span>
        <input id="q" autocomplete="off" enterkeyhint="search"
          placeholder="Start typing"></label>
    </div>
    <div id="hits"></div>
  </section>

  <footer>
    <a href="index.html">Open the full app</a>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   MY Jotter — a quick way to put somebody in the book

   Its own page, its own icon on the home screen, but the same
   web address as the main app, which means the same sign-in: if
   you are signed in there, you are signed in here.

   Built for the towpath. It assumes a poor signal and no time:
   two names and a boat is a perfectly good record, and if the
   save cannot get through it is kept on the phone and sent the
   next time you open this.
   ============================================================ */
const SUPABASE_URL = 'https://uloptfmzydaxymhecuub.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ffHo4CL3bl3m207Cjpf6RA_qqYIxUzc';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let ME=null, SHOT=null, GPS=null;
const QKEY='jot-waiting', RKEY='jot-recent';

function toast(t){
  const d=document.createElement('div');
  d.className='toast'; d.textContent=t; d.setAttribute('role','status');
  document.body.appendChild(d); setTimeout(()=>d.remove(),2600);
}
function uuid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });
}
function isoDay(d){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function store(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }
  catch(e){ console.warn('could not store',k,e); return false; } }
function recall(k,fallback){ try{ return JSON.parse(localStorage.getItem(k))||fallback; }
  catch(e){ return fallback; } }

/* ---------- Signing in is the main app's job ---------- */
async function whoAmI(){
  const {data:{user}}=await sb.auth.getUser();
  ME=user||null;
  paintStatus();
  return ME;
}

function paintStatus(){
  const waiting=recall(QKEY,[]);
  let html='';
  if(!ME){
    html+=`<div class="strip bad">You are not signed in. Open
      <a href="index.html">It&rsquo;s MY life</a>, sign in there, then come back
      &mdash; the two share the same sign-in.</div>`;
  }
  if(waiting.length){
    html+=`<div class="strip warn"><strong>${waiting.length}</strong>
      waiting to be sent${navigator.onLine?'':' &mdash; no signal just now'}.
      <button id="retry">Try now</button></div>`;
  }
  $('status').innerHTML=html;
  const r=$('retry'); if(r) r.onclick=()=>flushQueue(true);
}

/* ---------- Where you are, fetched quietly in the background ---------- */
function findMe(){
  if(!navigator.geolocation){ $('gpsNote').textContent=
    'This device cannot report a position.'; return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{ GPS={lat:pos.coords.latitude, lng:pos.coords.longitude};
      $('gpsNote').innerHTML='Your position will be saved with them, so you can '
        +'see on a map where you met. <button id="noGps" style="text-decoration:'
        +'underline;font-weight:600;color:var(--hull)">Do not save it</button>';
      const n=$('noGps'); if(n) n.onclick=()=>{ GPS=null;
        $('gpsNote').textContent='Position will not be saved.'; };
    },
    ()=>{ $('gpsNote').textContent='No position available, which is no great loss.'; },
    {enableHighAccuracy:true,timeout:15000,maximumAge:120000});
}

/* ---------- The photo ---------- */
async function shrink(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{
      const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    const scale=Math.min(1, max/Math.max(img.width,img.height));
    const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    return await new Promise(ok=>cv.toBlob(ok,'image/jpeg',0.82));
  } finally { URL.revokeObjectURL(url); }
}
function blobToData(blob){
  return new Promise(ok=>{ const r=new FileReader();
    r.onload=()=>ok(r.result); r.readAsDataURL(blob); });
}
function dataToBlob(d){
  const [head,b64]=String(d).split(','); const bin=atob(b64);
  const type=(head.match(/:(.*?);/)||[])[1]||'image/jpeg';
  const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Blob([a],{type});
}

async function tookPhoto(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast('That is not a photo'); return; }
  try{
    SHOT=await shrink(file,1200);
    const url=URL.createObjectURL(SHOT);
    $('shotPic').src=url; $('shotPic').hidden=false; $('shotPh').classList.add('hidden');
    $('shotName').textContent='Photo ready';
    $('shotDrop').classList.remove('hidden');
  }catch(e){ console.error(e); toast('Could not read that photo'); }
}
function dropPhoto(){
  SHOT=null; $('shotPic').hidden=true; $('shotPh').classList.remove('hidden');
  $('shotName').textContent='No photo yet';
  $('shotDrop').classList.add('hidden');
  $('fShot').value=''; $('fShotAny').value='';
}

/* ---------- Saving ---------- */
function readForm(){
  const v=id=>$(id).value.trim();
  return { first_name:v('fFirst')||null, last_name:v('fLast')||null,
           boat_name:v('fBoat')||null, phone:v('fPhone'),
           met_where:v('fWhere')||null, met_date:v('fDate')||null,
           notes:v('fNotes')||null,
           latitude:GPS?GPS.lat:null, longitude:GPS?GPS.lng:null };
}

function clearForm(){
  ['fFirst','fLast','fBoat','fPhone','fWhere','fNotes'].forEach(id=>$(id).value='');
  $('fDate').value=isoDay(new Date());
  dropPhoto();
  $('fFirst').focus();
}

async function save(){
  if(!ME){ toast('Sign in through the main app first'); return; }
  const f=readForm();
  if(!f.first_name && !f.last_name && !f.boat_name){
    toast('A name or a boat name, at least'); $('fFirst').focus(); return;
  }
  $('save').disabled=true; $('save').textContent='Saving…';
  const ok=await sendOne(f, SHOT);
  $('save').disabled=false; $('save').textContent='Save';

  if(ok==='queued'){
    toast('No signal — kept on the phone, and it will go next time');
  } else if(ok){
    toast('Saved');
  } else {
    toast('Could not save that'); return;
  }
  noteRecent(f, ok==='queued');
  clearForm(); paintStatus(); paintRecent();
}

// Returns true if it went, 'queued' if it is waiting, false if it was refused
// for a reason that trying again will not mend.
async function sendOne(f, shot){
  const row={ first_name:f.first_name, last_name:f.last_name,
    boat_name:f.boat_name, met_where:f.met_where, met_date:f.met_date,
    notes:f.notes, latitude:f.latitude, longitude:f.longitude,
    created_by:ME.id };
  if(f.phone) row.phones=[{label:'Mobile', value:f.phone}];

  let made=null;
  try{
    const {data,error}=await sb.from('contacts').insert(row).select().single();
    if(error) throw error;
    made=data;
  }catch(e){
    console.error(e);
    // Anything that smells like the network is worth keeping for later.
    if(!navigator.onLine || /fetch|network|timeout|failed/i.test(e.message||'')){
      await queue(f, shot); return 'queued';
    }
    return false;
  }

  if(shot){
    try{
      const path=`${made.id}/${uuid()}.jpg`;
      const {error}=await sb.storage.from('photos')
        .upload(path,shot,{contentType:'image/jpeg',upsert:false});
      if(error) throw error;
      await sb.from('contacts').update({avatar_path:path}).eq('id',made.id);
    }catch(e){
      console.error(e);
      toast('Saved, but the photo would not go up');
    }
  }
  return true;
}

async function queue(f, shot){
  const q=recall(QKEY,[]);
  const item={...f, at:Date.now(), id:uuid()};
  if(shot){
    try{ item.shot=await blobToData(shot); }
    catch(e){ console.warn('photo not kept',e); }
  }
  q.push(item);
  if(!store(QKEY,q)){
    // Out of room — keep the words, let the picture go.
    delete item.shot;
    if(store(QKEY,q)) toast('Kept, but there was no room for the photo');
    else toast('Could not keep that on the phone');
  }
}

async function flushQueue(loud){
  const q=recall(QKEY,[]);
  if(!q.length){ if(loud) toast('Nothing waiting'); return; }
  if(!ME){ if(loud) toast('Sign in through the main app first'); return; }
  if(!navigator.onLine){ if(loud) toast('Still no signal'); return; }

  const left=[]; let sent=0;
  for(const item of q){
    const shot=item.shot?dataToBlob(item.shot):null;
    const r=await sendOne(item, shot);
    if(r===true) sent++; else left.push(item);
  }
  store(QKEY,left);
  paintStatus();
  if(sent) toast(sent+' sent');
  else if(loud) toast('Still could not send those');
}

/* ---------- What this phone has added ---------- */
function noteRecent(f, waiting){
  const r=recall(RKEY,[]);
  r.unshift({ name:[f.first_name,f.last_name].filter(Boolean).join(' ')
                || f.boat_name || 'Somebody',
              boat:f.boat_name||'', at:Date.now(), waiting:!!waiting });
  store(RKEY, r.slice(0,8));
}
function paintRecent(){
  const r=recall(RKEY,[]);
  if(!r.length){ $('recent').innerHTML=''; return; }
  $('recent').innerHTML=`<div class="card" style="margin-top:18px">
    <h2>Put in from this phone</h2>
    ${r.map(x=>`<div class="hit">
      <span class="av">${esc((x.name||'?').charAt(0).toUpperCase())}</span>
      <span class="who"><b>${esc(x.name)}</b>
        <span>${esc(x.boat||'')}${x.boat?' &middot; ':''}${
          esc(new Date(x.at).toLocaleDateString('en-GB',
            {day:'numeric',month:'short'}))}${
          x.waiting?' &middot; waiting to send':''}</span></span>
    </div>`).join('')}
  </div>`;
}

/* ---------- Looking somebody up ---------- */
let findTimer=null;
async function findThem(){
  const s=$('q').value.trim();
  if(s.length<2){ $('hits').innerHTML=
    '<p class="empty">Type two letters or more.</p>'; return; }
  if(!ME){ $('hits').innerHTML='<p class="empty">Sign in through the main app first.</p>'; return; }
  $('hits').innerHTML='<p class="empty">Looking&hellip;</p>';
  // Commas and brackets are how a PostgREST filter is punctuated, and % and _
  // are its wildcards, so none of them can be allowed through from a search box.
  const like=`%${s.replace(/[%_,().]/g,' ').trim()}%`;
  const {data,error}=await sb.from('contacts')
    .select('id,first_name,last_name,boat_name,town,phones,mobile,phone')
    .or(`first_name.ilike.${like},last_name.ilike.${like},boat_name.ilike.${like}`)
    .limit(25);
  if(error){ console.error(error);
    $('hits').innerHTML='<p class="empty">Could not reach the book just now.</p>'; return; }
  const rows=data||[];
  if(!rows.length){ $('hits').innerHTML='<p class="empty">Nobody of that name.</p>'; return; }

  $('hits').innerHTML=`<div class="card">${rows.map(c=>{
    const name=[c.first_name,c.last_name].filter(Boolean).join(' ')||c.boat_name||'Somebody';
    const num=(Array.isArray(c.phones)&&c.phones[0]&&c.phones[0].value)||c.mobile||c.phone||'';
    const sub=[c.boat_name,c.town].filter(Boolean).join(' · ');
    return `<div class="hit">
      <span class="av">${esc(name.charAt(0).toUpperCase())}</span>
      <span class="who"><b>${esc(name)}</b><span>${esc(sub||'—')}</span></span>
      ${num?`<a class="go" href="tel:${esc(String(num).replace(/[^\d+]/g,''))}">Call</a>`:''}
      <a class="go" href="index.html#contact=${c.id}">Open</a>
    </div>`;}).join('')}</div>`;
}

/* ---------- Wiring ---------- */
$('tabAdd').onclick=()=>showTab('add');
$('tabFind').onclick=()=>showTab('find');
function showTab(which){
  const add=which==='add';
  $('addPane').classList.toggle('hidden',!add);
  $('findPane').classList.toggle('hidden',add);
  $('tabAdd').setAttribute('aria-pressed',String(add));
  $('tabFind').setAttribute('aria-pressed',String(!add));
  if(add) $('fFirst').focus(); else $('q').focus();
}

$('fShot').onchange=e=>tookPhoto(e.target.files&&e.target.files[0]);
$('fShotAny').onchange=e=>tookPhoto(e.target.files&&e.target.files[0]);
$('shotPickAny').onclick=()=>$('fShotAny').click();
$('shotDrop').onclick=dropPhoto;
$('save').onclick=save;
$('clear').onclick=()=>{ clearForm(); toast('Cleared'); };
$('q').oninput=()=>{ clearTimeout(findTimer); findTimer=setTimeout(findThem,300); };

// Enter moves you down the form rather than submitting something.
document.querySelectorAll('#addPane input').forEach((el,i,all)=>{
  el.addEventListener('keydown',ev=>{
    if(ev.key!=='Enter') return;
    ev.preventDefault();
    const next=all[i+1]; if(next) next.focus(); else $('fNotes').focus();
  });
});

window.addEventListener('online', ()=>{ paintStatus(); flushQueue(false); });
window.addEventListener('offline', paintStatus);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js')
    .catch(e=>console.warn('service worker did not register:',e));
}

// Running as an installed app rather than a browser tab means the icon is on
// the home screen. The main app shares this web address, so it reads this and
// stops offering to help you install something you already have.
function noteInstalled(){
  const standalone = (window.matchMedia
      && window.matchMedia('(display-mode: standalone)').matches)
    || window.navigator.standalone===true;   // how an iPhone says it
  if(!standalone) return;
  // Written raw, not as JSON, because that is how the main app reads it.
  try{ localStorage.setItem('jot-installed','1'); }catch(e){}
}

(async function start(){
  noteInstalled();
  $('fDate').value=isoDay(new Date());
  paintRecent();
  await whoAmI();
  findMe();
  flushQueue(false);
  if(ME) $('fFirst').focus();
})();
</script>
