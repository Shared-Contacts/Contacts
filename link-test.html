<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Link test</title>
<!-- A throwaway test page for URL Links' Open with (ML68, ML69, ML70).
     Round 2 (28 Oct 2026): the Chrome tests use barryandsandra.com, because
     the BBC News app took the BBC links in round 1, and two more ways to
     reach the Barclays app's Play Store page were added.
     It changes nothing in the app and saves nothing anywhere but this phone.
     Each button tries a different way of asking the phone to open a page in
     Chrome, the YouTube app or the Barclays app, so we can see which ones
     the phone allows from inside the installed My Life app. -->
<style>
:root{--ink:#10231C;--hull:#1D4A3A;--red:#B3322A;--paper:#FBFAF7;--panel:#FFF;--rule:#E3E1D8;--muted:#5C6B64}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:17px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
header{background:var(--hull);color:#F2EFE4;padding:16px}
header h1{margin:0;font-size:22px}
header p{margin:2px 0 0;font-size:15px;opacity:.85}
main{max-width:560px;margin:0 auto;padding:4px 16px 40px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin:14px 0}
h2{font-size:19px;margin:0 0 6px}
p{margin:6px 0}
a.go{display:block;font-weight:700;border-radius:10px;padding:14px;margin:8px 0 0;text-align:center;
  background:var(--hull);color:#F2EFE4;text-decoration:none}
.what{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.what button{font:inherit;font-size:15px;border:1.5px solid var(--rule);border-radius:999px;
  padding:6px 11px;background:#fff;color:var(--ink);cursor:pointer}
.what button[aria-pressed="true"]{background:var(--hull);border-color:var(--hull);color:#F2EFE4}
button.big{font:inherit;font-weight:700;border:0;border-radius:10px;padding:14px;width:100%;
  margin:8px 0 0;background:var(--hull);color:#F2EFE4;cursor:pointer}
button.plain{background:#fff;color:var(--ink);border:1.5px solid var(--rule)}
.where{padding:10px 12px;border-radius:8px;font-size:16px;margin:10px 0 0}
.good{background:#E1F0E6}
.bad{background:#F6E2DF}
pre{white-space:pre-wrap;font-family:inherit;font-size:15px;line-height:1.5;background:#F3F1EA;
  border-radius:8px;padding:10px 12px;margin:8px 0 0;min-height:3em}
small{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Link test, round 2</h1>
  <p>For URL Links in the My Life app. Nothing here changes the app.</p>
</header>
<main>

<div class="card">
  <h2>How to use it</h2>
  <p>Tap each green button in turn. See what opens, come back to this page,
     and tap the answer under that button. Then press <strong>Copy the
     results</strong> at the bottom and paste them into the Code tab.</p>
  <div id="where" class="where"></div>
</div>

<div id="tests"></div>

<div class="card">
  <h2>The results</h2>
  <pre id="out"></pre>
  <button class="big" id="copy">Copy the results</button>
  <button class="big plain" id="clear">Start again</button>
  <p id="copied"><small></small></p>
</div>

</main>
<script>
const YT_ID='jNQXAC9IVRw';            // a short, permanent public video
const BARCLAYS='com.barclays.android.barclaysmobilebanking';
const CHROME='com.android.chrome';
const enc=encodeURIComponent;
// No app on the phone claims this site, so it shows what Chrome itself does.
const SITE='www.barryandsandra.com/';
const TESTS=[
  {n:1, group:'Chrome', what:'An ordinary link to barryandsandra.com (what the app does now)',
   href:'https://'+SITE, blank:true},
  {n:2, group:'Chrome', what:'Ask for Chrome, with the ordinary page if it says no (what Open with does now)',
   href:'intent://'+SITE+'#Intent;scheme=https;package='+CHROME+';S.browser_fallback_url='+enc('https://'+SITE)+';end'},
  {n:3, group:'Chrome', what:'Ask for Chrome, with no fallback',
   href:'intent://'+SITE+'#Intent;scheme=https;package='+CHROME+';end'},
  {n:4, group:'Chrome', what:'Ask the phone to choose a browser',
   href:'intent://'+SITE+'#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end'},
  {n:5, group:'YouTube', what:'An ordinary YouTube link',
   href:'https://www.youtube.com/watch?v='+YT_ID, blank:true},
  {n:6, group:'YouTube', what:'Ask for the YouTube app (what Open with does now)',
   href:'intent://www.youtube.com/watch?v='+YT_ID+'#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url='+enc('https://www.youtube.com/watch?v='+YT_ID)+';end'},
  {n:7, group:'YouTube', what:'YouTube’s own kind of link',
   href:'vnd.youtube:'+YT_ID},
  {n:8, group:'Barclays', what:'Ask for the Barclays app with the web page, no fallback',
   href:'intent://www.barclays.co.uk/#Intent;scheme=https;package='+BARCLAYS+';end'},
  {n:9, group:'Barclays', what:'Ask for the Barclays app to start, as if from its icon',
   href:'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package='+BARCLAYS+';end'},
  {n:10, group:'Barclays', what:'Ask the Play Store to start the Barclays app',
   href:'market://launch?id='+BARCLAYS},
  {n:11, group:'Barclays', what:'The Barclays app’s page on the Play Store (last time this asked Google Play or App Market)',
   href:'market://details?id='+BARCLAYS},
  {n:12, group:'Barclays', what:'The same page, asking for Google Play by name (should skip the question)',
   href:'intent://details?id='+BARCLAYS+'#Intent;scheme=market;package=com.android.vending;end'},
  {n:13, group:'Barclays', what:'The same page, by its web address',
   href:'https://play.google.com/store/apps/details?id='+BARCLAYS, blank:true}
];
const ANSWERS=['Full Chrome opened','YouTube or Barclays app opened','A window inside My Life (with an X)',
  'Play Store, Barclays page','Asked which store','Nothing happened','An error','Something else'];

let got={};
try{ got=JSON.parse(localStorage.getItem('linktest2')||'{}')||{}; }catch(e){ got={}; }
const keep=()=>{ try{ localStorage.setItem('linktest2',JSON.stringify(got)); }catch(e){} };

const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)
  ||(window.matchMedia&&matchMedia('(display-mode: minimal-ui)').matches);
const where=document.getElementById('where');
where.className='where '+(standalone?'good':'bad');
where.textContent=standalone
  ? 'Good: this page is open inside the installed My Life app.'
  : 'This page is open in an ordinary browser tab, not inside the My Life app. '
    +'For a fair test, open it from a link in URL Links instead.';

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let last='';
document.getElementById('tests').innerHTML=TESTS.map(t=>{
  const head=t.group!==last?`<h2 style="margin:22px 0 0">${t.group}</h2>`:''; last=t.group;
  return head+`<div class="card"><p><strong>${t.n}.</strong> ${esc(t.what)}</p>
    <a class="go" href="${esc(t.href)}"${t.blank?' target="_blank" rel="noopener"':''}>Try ${t.n}</a>
    <div class="what">${ANSWERS.map(a=>`<button type="button" data-t="${t.n}" data-a="${esc(a)}"
      aria-pressed="${got[t.n]===a}">${esc(a)}</button>`).join('')}</div></div>`;
}).join('');

function paint(){
  document.querySelectorAll('[data-t]').forEach(b=>
    b.setAttribute('aria-pressed',String(got[b.dataset.t]===b.dataset.a)));
  const lines=TESTS.map(t=>t.n+'. '+t.group+': '+(got[t.n]||'not tried'));
  lines.unshift('Link test round 2, '+new Date().toLocaleString('en-GB'),
    'Opened '+(standalone?'inside the My Life app':'in a browser tab'),
    navigator.userAgent, '');
  document.getElementById('out').textContent=lines.join('\n');
}
document.getElementById('tests').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-t]'); if(!b) return;
  got[b.dataset.t]=got[b.dataset.t]===b.dataset.a?undefined:b.dataset.a; keep(); paint();
});
document.getElementById('copy').onclick=async()=>{
  const t=document.getElementById('out').textContent, s=document.querySelector('#copied small');
  try{ await navigator.clipboard.writeText(t); s.textContent='Copied. Paste it into the Code tab.'; }
  catch(e){ s.textContent='Could not copy. Press and hold on the results above and choose Select all, then Copy.'; }
};
document.getElementById('clear').onclick=()=>{
  if(!confirm('Clear all the answers?')) return; got={}; keep(); paint(); };
paint();
</script>
</body>
</html>
