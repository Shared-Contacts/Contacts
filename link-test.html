<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Link test</title>
<!-- A throwaway test page for URL Links' Open with (ML68 to ML70, ML85).
     Round 3 (28 Oct 2026): Firefox. Open with Firefox brought up a "Choose
     activity" box offering Chrome or Firefox, rather than going straight to
     Firefox. Each button tries a different way of asking for Firefox, plus
     what someone without Firefox would see, so we can keep the way that goes
     straight there. Rounds 1 and 2 (Chrome, YouTube, Barclays) are settled.
     It changes nothing in the app and saves nothing anywhere but this phone. -->
<style>
:root{--ink:#10231C;--hull:#1D4A3A;--red:#B3322A;--paper:#FBFAF7;--panel:#FFF;--rule:#E3E1D8;--muted:#5C6B64}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:17px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
header{background:var(--hull);color:#F2EFE4;padding:16px}
header h1{margin:0;font-size:22px}
header p{margin:2px 0 0;font-size:15px;opacity:.85}
main{max-width:560px;margin:0 auto;padding:4px 16px 40px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin:14px 0}
h2{font-size:19px;margin:0 0 6px}
p{margin:6px 0}
a.go{display:block;font-weight:700;border-radius:10px;padding:14px;margin:8px 0 0;text-align:center;
  background:var(--hull);color:#F2EFE4;text-decoration:none}
.what{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.what button{font:inherit;font-size:15px;border:1.5px solid var(--rule);border-radius:999px;
  padding:6px 11px;background:#fff;color:var(--ink);cursor:pointer}
.what button[aria-pressed="true"]{background:var(--hull);border-color:var(--hull);color:#F2EFE4}
button.big{font:inherit;font-weight:700;border:0;border-radius:10px;padding:14px;width:100%;
  margin:8px 0 0;background:var(--hull);color:#F2EFE4;cursor:pointer}
button.plain{background:#fff;color:var(--ink);border:1.5px solid var(--rule)}
.where{padding:10px 12px;border-radius:8px;font-size:16px;margin:10px 0 0}
.good{background:#E1F0E6}
.bad{background:#F6E2DF}
pre{white-space:pre-wrap;font-family:inherit;font-size:15px;line-height:1.5;background:#F3F1EA;
  border-radius:8px;padding:10px 12px;margin:8px 0 0;min-height:3em}
small{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Link test, round 3</h1>
  <p>For URL Links in the My Life app. Nothing here changes the app.</p>
</header>
<main>

<div class="card">
  <h2>How to use it</h2>
  <p>Tap each green button in turn. See what opens, come back to this page,
     and tap the answer under that button. Then press <strong>Copy the
     results</strong> at the bottom and paste them into the Code tab.</p>
  <div id="where" class="where"></div>
</div>

<div id="tests"></div>

<div class="card">
  <h2>The results</h2>
  <pre id="out"></pre>
  <button class="big" id="copy">Copy the results</button>
  <button class="big plain" id="clear">Start again</button>
  <p id="copied"><small></small></p>
</div>

</main>
<script>
const FIREFOX='org.mozilla.firefox';
const enc=encodeURIComponent;
// No app on the phone claims this site, so it shows what the browsers do.
const SITE='www.barryandsandra.com/';
const STORE='https://play.google.com/store/apps/details?id='+FIREFOX;
const OPENED=['Full Firefox, no question','Asked: Chrome or Firefox','A window inside My Life (with an X)',
  'Full Chrome','Play Store, Firefox page','Asked which store','Nothing happened','Something else'];
const TESTS=[
  {n:1, group:'Firefox', what:'Ask for Firefox, with the ordinary page if it says no (what Open with Firefox does now)',
   href:'intent://'+SITE+'#Intent;scheme=https;package='+FIREFOX+';S.browser_fallback_url='+enc('https://'+SITE)+';end'},
  {n:2, group:'Firefox', what:'Ask for Firefox, with no fallback',
   href:'intent://'+SITE+'#Intent;scheme=https;package='+FIREFOX+';end'},
  {n:3, group:'Firefox', what:'Ask for Firefox, saying it is a web page to view',
   href:'intent://'+SITE+'#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package='+FIREFOX+';end'},
  {n:4, group:'Firefox', what:'Firefox’s own kind of link (it may not have one; then expect Nothing happened)',
   href:'intent://open-url?url='+enc('https://'+SITE)+'#Intent;scheme=firefox;package='+FIREFOX+';end'},
  {n:5, group:'Without Firefox', what:'Ask for an app that is not on the phone, falling back to Firefox’s Play Store page (what someone without Firefox would get)',
   href:'intent://'+SITE+'#Intent;scheme=https;package=org.mozilla.notonthisphone;S.browser_fallback_url='+enc(STORE)+';end'},
  {n:6, group:'Without Firefox', what:'Firefox’s Play Store page, by its web address',
   href:STORE, blank:true},
  {n:7, group:'Afterwards', what:'When full Firefox opened (choose Firefox if it asked), press the recent-apps button. Were My Life and Firefox both there?',
   answers:['Yes, both there','No, only one','Firefox never opened']}
];

let got={};
try{ got=JSON.parse(localStorage.getItem('linktest3')||'{}')||{}; }catch(e){ got={}; }
const keep=()=>{ try{ localStorage.setItem('linktest3',JSON.stringify(got)); }catch(e){} };

const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)
  ||(window.matchMedia&&matchMedia('(display-mode: minimal-ui)').matches);
const where=document.getElementById('where');
where.className='where '+(standalone?'good':'bad');
where.textContent=standalone
  ? 'Good: this page is open inside the installed My Life app.'
  : 'This page is open in an ordinary browser tab, not inside the My Life app. '
    +'For a fair test, open it from a link in URL Links instead.';

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let last='';
document.getElementById('tests').innerHTML=TESTS.map(t=>{
  const head=t.group!==last?`<h2 style="margin:22px 0 0">${t.group}</h2>`:''; last=t.group;
  return head+`<div class="card"><p><strong>${t.n}.</strong> ${esc(t.what)}</p>
    ${t.href?`<a class="go" href="${esc(t.href)}"${t.blank?' target="_blank" rel="noopener"':''}>Try ${t.n}</a>`:''}
    <div class="what">${(t.answers||OPENED).map(a=>`<button type="button" data-t="${t.n}" data-a="${esc(a)}"
      aria-pressed="${got[t.n]===a}">${esc(a)}</button>`).join('')}</div></div>`;
}).join('');

function paint(){
  document.querySelectorAll('[data-t]').forEach(b=>
    b.setAttribute('aria-pressed',String(got[b.dataset.t]===b.dataset.a)));
  const lines=TESTS.map(t=>t.n+'. '+t.group+': '+(got[t.n]||'not tried'));
  lines.unshift('Link test round 3, '+new Date().toLocaleString('en-GB'),
    'Opened '+(standalone?'inside the My Life app':'in a browser tab'),
    navigator.userAgent, '');
  document.getElementById('out').textContent=lines.join('\n');
}
document.getElementById('tests').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-t]'); if(!b) return;
  got[b.dataset.t]=got[b.dataset.t]===b.dataset.a?undefined:b.dataset.a; keep(); paint();
});
document.getElementById('copy').onclick=async()=>{
  const t=document.getElementById('out').textContent, s=document.querySelector('#copied small');
  try{ await navigator.clipboard.writeText(t); s.textContent='Copied. Paste it into the Code tab.'; }
  catch(e){ s.textContent='Could not copy. Press and hold on the results above and choose Select all, then Copy.'; }
};
document.getElementById('clear').onclick=()=>{
  if(!confirm('Clear all the answers?')) return; got={}; keep(); paint(); };
paint();
</script>
</body>
</html>
